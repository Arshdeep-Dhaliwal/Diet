<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<title>Four Pillars</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#faf9f7;--card:#ffffff;--bd:#e7e4de;--bd2:#d5d1c8;
  --text:#1c1b19;--t2:#6e6b64;--t3:#6f6c66;
  --acc:#2f6f5e;--acc-bg:#eaf3f0;--on-acc:#ffffff;--today:#f1f6f3;
  --warn:#81591a;--warn-bg:#fbf3e3;--alert:#a14545;--shade:rgba(28,27,25,.4);
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --topH:56px;
  --cols:44px 62px 62px minmax(0,1fr) minmax(0,1.12fr);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141413;--card:#1c1c1a;--bd:#2c2b28;--bd2:#3a3934;--text:#f0eee9;--t2:#a3a099;--t3:#8a877f;
        --acc:#6cbfa6;--acc-bg:#1d2a26;--on-acc:#10201b;--today:#17201c;
        --warn:#d7a75a;--warn-bg:#2a2418;--alert:#e08f8f;--shade:rgba(0,0,0,.6)}
}
@media (min-width:640px){:root{--cols:88px 104px 104px minmax(0,1fr) minmax(0,1.2fr)}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
     padding-bottom:calc(env(safe-area-inset-bottom) + 96px)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:980px;margin:0 auto;padding:0 8px}
@media (min-width:640px){.app{padding:0 24px}}

.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;
     height:calc(env(safe-area-inset-top) + var(--topH));padding:env(safe-area-inset-top) 4px 0}
.top h1{font-size:17px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
.top p{font-size:12.5px;color:var(--t2);line-height:1.3}
.nav{margin-left:auto;display:flex;gap:6px}
.nb{height:36px;min-width:36px;padding:0 11px;border:1px solid var(--bd);border-radius:9px;background:var(--card);
    color:var(--t2);font-size:13.5px}
.nb:active{background:var(--bg)}

.mx{border:1px solid var(--bd);border-radius:14px;background:var(--card);overflow:clip}
.r{display:grid;grid-template-columns:var(--cols)}
.r+.r{border-top:1px solid var(--bd)}
.r>div{padding:6px 4px;min-width:0}
.r>div+div{border-left:1px solid var(--bd)}
.hd{position:sticky;top:calc(env(safe-area-inset-top) + var(--topH));z-index:10;background:var(--card);
    box-shadow:0 1px 0 var(--bd2)}
.hd+.r{border-top:0}
.hd>div{font-size:12px;font-weight:600;color:var(--t2);line-height:1.25;padding:9px 4px 8px}
.dc b{display:block;font-size:13px;font-weight:600;line-height:1.2}
.dc span{display:block;font-size:12px;color:var(--t2)}
.dc small{display:block;font-size:12px;color:var(--t2);margin-top:6px;line-height:1.2}
.r.today{background:var(--today)}
.r.today .dc b,.r.today .dc span{color:var(--acc)}
.cell{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,118px),1fr));gap:4px}
.ch{display:block;width:100%;min-height:40px;text-align:left;border:1px solid var(--bd);background:var(--bg);
    border-radius:8px;padding:5px 6px;font-size:12px;line-height:1.25}
.ch:active{border-color:var(--bd2)}
.ch .n{display:block;font-weight:500;overflow-wrap:anywhere}
.ch .s{display:block;font-size:11px;color:var(--t2);margin-top:2px;overflow-wrap:anywhere}
.ch.done{background:var(--acc-bg);border-color:var(--acc);color:var(--acc)}
.ch.done .s{color:var(--acc)}
.r.future .ch{background:transparent;border-style:dashed}
.em{font-size:12px;color:var(--t2);padding:4px 2px}
.rest{display:flex;align-items:center;font-size:12.5px;color:var(--t2)}
.r>.rest{grid-column:span 3;padding:6px 10px}
.tot{background:var(--bg)}
.tt{font-size:11.5px;line-height:1.35;color:var(--t2)}
.tt b{font-weight:600;color:var(--text)}
.tt b.met{color:var(--acc)}
.tt div+div{margin-top:2px}
.mx.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mx.scroll .r{width:max-content;min-width:100%;grid-template-columns:76px 148px 132px minmax(180px,1fr) minmax(200px,1.1fr)}
.mx.scroll .dc,.mx.scroll .hd>div:first-child{position:sticky;left:0;background:var(--card);z-index:2}
.mx.scroll .hd>div:first-child{z-index:12}
.mx.scroll .r.today .dc{background:var(--today)}
.mx.scroll .tot .dc{background:var(--bg)}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;margin:18px 4px 0;
      font-size:12px;color:var(--t2)}
.foot button{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:7px 12px;font-size:12.5px;color:var(--t2)}

.shade{position:fixed;inset:0;background:var(--shade);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;background:var(--card);
       border:1px solid var(--bd);border-bottom:0;border-radius:16px 16px 0 0;max-height:88vh;max-height:88dvh;
       overflow-y:auto;overscroll-behavior:contain;padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);
       animation:up .2s ease-out}
.sheet:focus{outline:none}
@keyframes up{from{transform:translateY(24px)}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--bd2);margin:0 auto 12px}
.sh{display:flex;align-items:flex-start;gap:12px}
.sh h2{font-size:18px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.sh p{font-size:12.5px;color:var(--t2);margin-top:2px}
.x{margin-left:auto;width:36px;height:36px;flex-shrink:0;border:1px solid var(--bd);border-radius:9px;
   background:var(--card);color:var(--t2);font-size:19px;line-height:1}
.tg{margin-top:12px;font-size:14px;font-weight:600;color:var(--acc)}
.last{margin-top:10px;font-size:12.5px;color:var(--t2)}
.last b{color:var(--text);font-weight:500}
.up{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13px}
.more{margin-top:8px;font-size:13px;color:var(--t2)}
.more summary{cursor:pointer;font-weight:600;color:var(--acc)}
.more p{margin-top:4px}
.sets{margin-top:12px}
.sr{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 40px;gap:8px;align-items:center;margin-bottom:8px}
.sets.noload .sr{grid-template-columns:28px minmax(0,1fr) 40px}
.sr.h{font-size:12px;color:var(--t2);margin-bottom:4px}
.sr input{width:100%;min-width:0;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px 9px;font-size:16px}
.sr input:focus{outline:2px solid var(--acc);outline-offset:1px}
.sn{font-size:13px;color:var(--t2)}
.rm{height:44px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--t2);font-size:17px}
.hint{font-size:12px;color:var(--t2)}
.quiet{margin-top:2px;padding:6px 0;border:0;background:none;color:var(--t2);font-size:12.5px;text-decoration:underline}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{min-height:44px;border:1px solid var(--bd2);background:var(--card);border-radius:10px;padding:10px 14px;
     font-size:14px;font-weight:500}
.btn:active{background:var(--bg)}
.btn:disabled{color:var(--t2)}
.btn.pri{margin-left:auto;background:var(--acc);border-color:var(--acc);color:var(--on-acc);padding:10px 22px}
.btn.pri:disabled{background:var(--bg);border-color:var(--bd);color:var(--t2)}
.st{min-height:19px;margin-top:8px;font-size:12.5px;color:var(--acc)}
.st.err{color:var(--alert)}
.st:empty{display:none}
.sheet .st:empty{display:block}
.del{margin-top:4px;padding:6px 0;border:0;background:none;color:var(--t2);font-size:12.5px;text-decoration:underline}
.wait{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--bg);font-size:13px;color:var(--t2)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;gap:2px;
      background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
.tabs button{flex:1;max-width:none;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;
      border-radius:10px;padding:6px 0 4px;font-size:10.5px;line-height:1.15;white-space:nowrap;color:var(--t2)}
.tabs svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--acc);font-weight:600}

.pg{display:flex;flex-direction:column;gap:12px}
.goal{font-size:13px;color:var(--t2);padding:0 4px}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--bd2);border-radius:10px}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 16px;font-size:13.5px;color:var(--t2)}
.seg button[aria-pressed="true"]{background:var(--acc-bg);color:var(--acc);font-weight:500}
.wk{display:flex;gap:4px;overflow-x:auto}
.wd{flex:1 0 44px;min-width:44px;display:flex;flex-direction:column;align-items:center;border:1px solid var(--bd);background:var(--card);border-radius:10px;
    padding:7px 0 8px;font-size:11px;color:var(--t2);line-height:1.3}
.wd b{font-size:15px;font-weight:600;color:var(--text)}
.wd.fu{border-style:dashed;background:transparent}
.wd.td>span,.wd.td b{color:var(--acc)}
.wd[aria-pressed="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.bar{display:block;width:72%;height:4px;border-radius:2px;background:var(--bd);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.dh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:4px 4px 0}
.dh h2{font-size:15px;font-weight:600;letter-spacing:-.01em}
.dh span{font-size:12.5px;color:var(--t2);text-align:right}
.gh{font-size:12.5px;font-weight:600;color:var(--t2);padding:10px 14px 2px}
.list{border:1px solid var(--bd);border-radius:14px;background:var(--card);overflow:clip}
.ck{display:grid;grid-template-columns:88px minmax(0,1fr) 26px;align-items:center;gap:10px;width:100%;min-height:56px;
    text-align:left;border:0;background:none;padding:10px 14px}
.list.nt .ck{grid-template-columns:minmax(0,1fr) 26px}
.list>.ck+.ck,.list>.qrow+.qrow,.list>.ck+.qrow,.list>.qrow+.ck,.list>.ck+.gh,.list>.qrow+.gh{border-top:1px solid var(--bd)}
.qrow{display:flex;align-items:stretch}
.qrow .ck{flex:1;border-top:0}
.ed{width:52px;flex-shrink:0;border:0;border-left:1px solid var(--bd);background:none;color:var(--acc);font-size:12.5px;font-weight:600}
.ed:disabled{color:var(--t3);cursor:default}
.ed:active{background:var(--bg)}
.ck:disabled{cursor:default}
.ck .tm{font-size:12.5px;color:var(--t2);line-height:1.25}
.ck .nm{display:block;font-size:14.5px;font-weight:500;line-height:1.3}
.ck .sb{display:block;font-size:12px;color:var(--t2);line-height:1.35;margin-top:1px}
.bx{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--bd2);display:grid;place-items:center;
    font-size:13px;color:transparent}
.go{width:26px;text-align:center;font-size:20px;line-height:1;color:var(--t2)}
.ck.on .bx,.tick.on .bx{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.ck.on .nm{color:var(--t2)}
.ck.opt .bx{border-style:dashed}
.ck.fu .bx{border-style:dashed;opacity:.6}
.nx{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;background:var(--acc-bg);color:var(--acc);
    font-size:11px;font-weight:600;vertical-align:1px}
.note{padding:10px 14px;font-size:12.5px;color:var(--t2);border-top:1px solid var(--bd)}
.note.out{border:0;padding:0 4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.stat{border:1px solid var(--bd);border-radius:12px;background:var(--card);padding:10px 12px}
.stat b{display:block;font-size:20px;font-weight:600;letter-spacing:-.01em}
.stat b.met{color:var(--acc)}
.stat b small{font-size:13px;font-weight:500;color:var(--t2)}
.stat span{display:block;font-size:12px;color:var(--t2);margin-top:1px}
.sw{border:1px solid var(--bd);border-radius:14px;background:var(--card);overflow:clip}
.sw .r{grid-template-columns:72px 1fr 1fr}
.sw .hd>div{padding:9px 8px}
.sw .dc{padding:8px}
.tick{min-height:52px;border:0;border-left:1px solid var(--bd);background:none;display:flex;align-items:center;justify-content:center;gap:8px;
      color:var(--t2);font-size:13px;font-weight:500}
.tick:disabled{cursor:default;opacity:.55}
.tick.on{color:var(--acc)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:15px;font-weight:600;letter-spacing:-.01em}
.ta{width:100%;min-height:96px;resize:vertical;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.45}
.ta:focus{outline:2px solid var(--acc);outline-offset:1px}
.planbox{border:1px solid var(--bd);border-radius:14px;background:var(--card);padding:12px 14px}
.planbox b{display:block;font-size:12.5px;font-weight:600;color:var(--t2);margin-bottom:4px}
.planbox p{font-size:14.5px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="app" class="app">
  <div class="top" id="top"></div>
  <main id="main"></main>
  <div class="foot">
    <span>Saved in this browser only.</span>
    <button type="button" onclick="exportData()">Export</button>
    <button type="button" onclick="document.getElementById('imp').click()">Import</button>
    <input id="imp" type="file" accept="application/json,.json" hidden onchange="importData(this)">
  </div>
  <nav class="tabs" aria-label="Pillars">
    <button type="button" data-t="sleep" onclick="setTab('sleep')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Sleep</button>
    <button type="button" data-t="diet" onclick="setTab('diet')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19C5 11 10 5 19 5c0 9-6 14-14 14zM5 19l7-7"/></svg>Diet</button>
    <button type="button" data-t="workout" onclick="setTab('workout')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 7v10M17.5 7v10M3.5 10v4M20.5 10v4M6.5 12h11"/></svg>Workout</button>
    <button type="button" data-t="fert" onclick="setTab('fert')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/></svg>Fertility</button>
    <button type="button" data-t="journal" onclick="setTab('journal')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h8.5L19 7v13.5H7zM15.5 3.5V7H19M9 11h7M9 15h5"/></svg>Journal</button>
  </nav>
</div>
<div id="sheetRoot"></div>
<script>
/* =================== THE ROUTINE =================== */
const DAYS=["mon","tue","wed","thu","fri","sat","sun"];
const DNAME={mon:"Monday",tue:"Tuesday",wed:"Wednesday",thu:"Thursday",fri:"Friday",sat:"Saturday",sun:"Sunday"};
const DSHORT={mon:"Mon",tue:"Tue",wed:"Wed",thu:"Thu",fri:"Fri",sat:"Sat",sun:"Sun"};
const TAG={mon:"Heavy",tue:"Zone 2",wed:"Heavy",thu:"VO2",fri:"Light",sat:"Long",sun:"Rest"};
const COLS=[["z2","Zone 2"],["vo2","VO2 max"],["me","Mobility & endurance"],["st","Strength"]];
const HEAVY="Heavy, on the machine: 1–2 lighter warm-up sets, then stop each working set with 2–3 good reps left.";
const LIGHT="Light free weights: stop each set with 3–4 good reps left, lowering slowly.";
const QUICK=new Set(["pushups","hindu","stretch"]);
const NO_LOAD=new Set(["pushups","hindu","stretch","plank","hang","balance"]);

const EX={
 "zone2":{n:"Incline walk",f:"Zone 2 incline walk",m:"time",u:"min",wl:"Vest lb",wf:w=>w+" lb vest",
   c:"Easy enough to talk in full sentences. Start around 5–8% incline at 4.5–5 km/h and adjust. Don't hold the rails."},
 "sled":{n:"Sled intervals",f:"Sled-push treadmill intervals",m:"time",u:"min",wl:"Level",wf:w=>"level "+w,
   c:"Hard means about 8/10, only a few words. Use the built-in sled mode only, at a resistance where your breathing, not leg burn, stops you. Start at 4 × 2 min; go to 3, then 4 min after two good sessions at each length. Log each hard interval as a set."},
 "pushups":{n:"Push-ups",f:"Push-ups",m:"reps",
   c:"Daily dose, in the warm-up. Split into two mini-sets, or put your hands on a bench, if 15–20 in a row isn't comfortable yet."},
 "hindu":{n:"Hindu squats",f:"Hindu squats",m:"reps",
   c:"Daily dose, in the warm-up. Add about 5 reps a week at most; high reps load the knees."},
 "pullups":{n:"Pull-ups",f:"Assisted pull-ups (machine)",m:"reps",wl:"Assist lb",wf:w=>w+" lb assist",
   c:"Stop with 2–3 clean reps left. Lower the assistance as you get stronger."},
 "stretch":{n:"Stretch",f:"Full-body stretch",m:"time",u:"min"},
 "plank":{n:"Side plank",f:"Side plank",m:"time",u:"sec",c:"Log each side as its own set if you like."},
 "hang":{n:"Dead hang",f:"Dead hang",m:"time",u:"sec",c:"For grip and shoulders. Stop before your grip gives out."},
 "carry":{n:"Farmer's carry",f:"Farmer's carry",m:"time",u:"sec",wl:"lb per hand",wf:w=>w+" lb per hand",
   c:"30–40 m per set, walking tall. Pick dumbbells you can carry without leaning."},
 "balance":{n:"Balance",f:"Single-leg balance",m:"time",u:"sec",c:"Stand near a rail or wall. Log each leg as its own set if you like."},
 "leg-press":{n:"Leg press",f:"Leg press (machine)",m:"reps",top:10,
   c:"Lower only as far as your low back stays on the pad, and don't lock the knees hard at the top."},
 "chest-machine":{n:"Chest press",f:"Chest press (machine)",m:"reps",top:10,c:"Set the seat so the handles line up with mid-chest."},
 "row":{n:"Seated row",f:"Seated cable row",m:"reps",top:12,c:"Tall chest, pull to the lower ribs."},
 "ham-curl":{n:"Leg curl",f:"Seated leg curl",m:"reps",top:15,c:"Same exercise as the hamstring curl."},
 "adductor":{n:"Adductor",f:"Adductor machine",m:"reps",top:15},
 "smith-rdl":{n:"Smith RDL",f:"Smith-machine Romanian deadlift",m:"reps",top:8,
   c:"Flat back, push the hips back, and stop when the hamstrings are tight, about mid-shin."},
 "shoulder-machine":{n:"Shoulder press",f:"Shoulder press (machine)",m:"reps",top:10,
   c:"Covers the military and overhead press. Use the neutral grip if your shoulders complain."},
 "cs-row":{n:"Supported row",f:"Chest-supported row (machine)",m:"reps",top:12,c:"Chest stays on the pad, so your low back rests after the RDLs."},
 "decline-machine":{n:"Decline press",f:"Decline press (machine)",m:"reps",top:10,c:"On the machine, or a Smith machine with the safety stops set."},
 "abductor":{n:"Abductor",f:"Abductor machine",m:"reps",top:15},
 "squat-db":{n:"Goblet squat",f:"Goblet squat (light dumbbell)",m:"reps",top:15,c:"Keep it light; Friday follows Thursday's intervals."},
 "press-incline":{n:"Incline DB press",f:"Incline dumbbell press (light)",m:"reps",top:15},
 "db-rdl":{n:"DB RDL",f:"Dumbbell Romanian deadlift (light)",m:"reps",top:12,c:"Same flat-back hinge as Wednesday, with light dumbbells."},
 "barbell-curl":{n:"Barbell curl",f:"Barbell curl",m:"reps",top:15,c:"An EZ bar is easier on the wrists."},
 "pushdown":{n:"Pushdown",f:"Cable triceps pushdown",m:"reps",top:15}
};

const DOSE=[{id:"pushups",t:"15–20 reps, daily dose",i:"15–20",s:1},{id:"hindu",t:"15–20 reps, daily dose",i:"15–20",s:1}];
const PULL={id:"pullups",t:"3 × 5–8",s:3};
const STRETCH={id:"stretch",t:"5 min: hips, hamstrings, chest and lats",i:"5 min",s:1};
const PLAN={
 mon:{z2:[{id:"zone2",t:"15 min after lifting",b:"15 min",i:"",s:1}],vo2:[],
      me:[...DOSE,PULL,STRETCH],

const K="bt26:";
const S={
 get(k,d){try{const v=localStorage.getItem(K+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
 set(k,v){try{localStorage.setItem(K+k,JSON.stringify(v));return true}catch(e){return false}}
};
const $=s=>document.querySelector(s);
const esc=v=>String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const pad=n=>String(n).padStart(2,"0");
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseD(s){return new Date(s+"T00:00:00")}
function todayKey(){return ymd(new Date())}
let weekOff=0;
function monday(off){const d=parseD(todayKey());d.setDate(d.getDate()-((d.getDay()+6)%7)+7*off);return d}
function dateOf(dk){const d=monday(weekOff);d.setDate(d.getDate()+DAYS.indexOf(dk));return ymd(d)}
const longDate=s=>parseD(s).toLocaleDateString(undefined,{day:"numeric",month:"long"});
const shortDate=s=>parseD(s).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const dkOf=s=>DAYS[(parseD(s).getDay()+6)%7];
function isWide(){return matchMedia("(min-width:640px)").matches}

function logs(id){const v=S.get("lift:"+id,[]);return Array.isArray(v)?v:[]}
function entryOn(id,date){return logs(id).find(x=>x.d===date)||null}
function logsBefore(id,date){return logs(id).filter(x=>x.d<date).sort((a,b)=>a.d.localeCompare(b.d))}
function lb(v,unit){const n=Number(v);if(!isFinite(n))return null;return unit&&unit!=="lb"?Math.round(n*2.2046226218*100)/100:n}
function norm(e){
 if(!e)return null;
 if(!Array.isArray(e.sets))return {legacy:true,mode:"reps",sets:[{reps:null,t:null,w:lb(e.w,e.unit)}]};
 return {mode:e.mode==="time"?"time":"reps",sets:e.sets.map(s=>({
  reps:s.reps==null?null:Number(s.reps),t:s.t==null?null:Number(s.t),
  w:s.w==null||s.w===""?null:lb(s.w,e.unit)}))};
}
const unitOf=id=>EX[id].u||"sec";
function modeOf(id){const m=S.get("mode:"+id,null);return m==="time"||m==="reps"?m:EX[id].m}
const nf=n=>String(Math.round(n*100)/100);
const hasW=w=>w!=null&&w!==0;
function wtxt(w,id){const ex=EX[id];return ex.wf?ex.wf(nf(w)):nf(w)+" lb"}
function fmtT(t){t=Math.round(t);if(t<60)return t+" s";if(t%60===0)return t/60+" min";return Math.floor(t/60)+":"+pad(t%60)+" min"}
function summary(e,id){
 const n=norm(e);if(!n)return "";
 if(n.legacy)return (hasW(n.sets[0].w)?wtxt(n.sets[0].w,id)+", ":"")+"reps not recorded";
 const main=s=>n.mode==="time"?fmtT(s.t||0):String(s.reps);
 const ws=n.sets.map(s=>hasW(s.w)?s.w:null),same=ws.every(w=>w===ws[0]);
 if(same){const base=n.sets.map(main).join(", ")+(n.mode==="reps"?" reps":"");return ws[0]!=null?base+" @ "+wtxt(ws[0],id):base}
 return n.sets.map(s=>main(s)+(n.mode==="reps"?" reps":"")+(hasW(s.w)?" @ "+wtxt(s.w,id):"")).join(", ");
}
function shortSum(e){
 const n=norm(e);if(!n)return "";if(n.legacy)return "logged";
 const k=n.sets.length;
 if(n.mode==="time")return k===1?fmtT(n.sets[0].t||0):k+" sets";
 if(n.sets.every(s=>!hasW(s.w)))return n.sets.reduce((a,s)=>a+(s.reps||0),0)+" reps";
 return k===1?n.sets[0].reps+" reps":k+" sets";
}
function topped(id,date){
 const top=EX[id].top;if(!top)return false;
 const l=logsBefore(id,date).map(norm).filter(n=>n&&!n.legacy&&n.mode==="reps"&&n.sets.length);
 return l.length>=2&&l.slice(-2).every(n=>n.sets.every(s=>s.reps>=top));
}
function writeLog(id,date,entry){
 const list=logs(id).filter(x=>x.d!==date);
 list.push(entry);list.sort((a,b)=>a.d.localeCompare(b.d));
 return S.set("lift:"+id,list);
}
function clearLog(id,date){
 delete drafts[draftKey(id,date)];
 return S.set("lift:"+id,logs(id).filter(x=>x.d!==date));
}
function targetLog(inst,id){
 const t=inst.t||"",mode=modeOf(id);
 if(mode==="time"){
  let m=t.match(/(\d+(?:[.,]\d+)?)\s*min/i);
  if(m)return {mode:"time",sets:[{t:Math.round(parseFloat(m[1].replace(",","."))*60),w:null}]};
  m=t.match(/(\d+)\s*s\b/i);
  if(m)return {mode:"time",sets:[{t:+m[1],w:null}]};
  return {mode:"time",sets:[{t:300,w:null}]};
 }
 const m=t.match(/(\d+)/);
 return {mode:"reps",sets:[{reps:m?+m[1]:1,w:null}]};
}
function daySeq(dk){
 const seq=[];
 COLS.forEach(([c,name])=>{(PLAN[dk][c]||[]).forEach((inst,i)=>seq.push({dk,col:c,i,inst,group:name}))});
 return seq;
}
function weekNumbers(){
 const ds=DAYS.map(dateOf),inWk=e=>ds.includes(e.d);
 const reps=n=>n&&!n.legacy&&n.mode==="reps"?n.sets.reduce((a,s)=>a+(s.reps||0),0):0;
 let z2=0,pu=0,hs=0,pl=0,st=0;
 logs("zone2").filter(inWk).forEach(e=>{const n=norm(e);if(n&&n.mode==="time")n.sets.forEach(s=>z2+=s.t||0)});
 const vo2=logs("sled").filter(inWk).length;
 logs("pushups").filter(inWk).forEach(e=>pu+=reps(norm(e)));
 logs("hindu").filter(inWk).forEach(e=>hs+=reps(norm(e)));
 logs("pullups").filter(inWk).forEach(e=>pl+=reps(norm(e)));
 DAYS.forEach((dk,i)=>{
  const list=PLAN[dk].st||[];
  if(list.length&&list.every(x=>entryOn(x.id,ds[i])))st++;
 });
 return {z2:Math.round(z2/60),vo2,pu,hs,pl,st};
}

/* =================== DRAFTS =================== */
const drafts={};
const draftKey=(id,date)=>date+"|"+id;
function tIn(t,unit){t=Math.round(t);return unit==="min"?String(Math.round(t/60*100)/100):String(t)}
function parseT(v,unit){
 v=String(v).trim().toLowerCase();if(!v)return null;
 let m=v.match(/^(\d+):([0-5]?\d)$/);if(m)return (+m[1])*60+(+m[2]);
 m=v.match(/^(\d+(?:[.,]\d+)?)\s*(s|sec|m|min)?$/);if(!m)return NaN;
 const x=parseFloat(m[1].replace(",",".")),u=m[2]?(m[2][0]==="s"?"sec":"min"):unit;
 return Math.round(u==="min"?x*60:x);
}
function toDraft(n,id){
 if(n.legacy)return {mode:"reps",sets:[{a:"",w:hasW(n.sets[0].w)?nf(n.sets[0].w):""}]};
 return {mode:n.mode,sets:n.sets.map(s=>({a:n.mode==="time"?tIn(s.t||0,unitOf(id)):String(s.reps==null?"":s.reps),
  w:s.w==null?"":nf(s.w)}))};
}
function draft(){
 const {id,date,inst}=cur,k=draftKey(id,date);
 if(!drafts[k]){const n=norm(entryOn(id,date));
  drafts[k]=n?toDraft(n,id):{mode:modeOf(id),sets:Array.from({length:Math.max(1,inst.s||1)},()=>({a:"",w:""}))}}
 return drafts[k];
}
function ph(i,f){
 const {id,date}=cur,dr=draft(),l=logsBefore(id,date),n=norm(l[l.length-1]),unit=unitOf(id);
 if(n&&!n.legacy&&n.mode===dr.mode&&n.sets.length){
  const s=n.sets[Math.min(i,n.sets.length-1)];
  if(f==="a")return dr.mode==="time"?tIn(s.t||0,unit):String(s.reps);
  if(hasW(s.w))return nf(s.w);
 }
 return f==="a"?(dr.mode==="time"?unit:"reps"):"–";
}
function lastNorm(){
 const l=logsBefore(cur.id,cur.date),n=norm(l[l.length-1]);
 if(!n||n.legacy||!n.sets.length)return null;
 if(n.mode==="time"&&n.sets.every(s=>!s.t))return null;
 if(n.mode==="reps"&&n.sets.every(s=>!s.reps))return null;
 return n;
}
function showLoad(id,dr){
 if(!NO_LOAD.has(id))return true;
 return dr.sets.some(s=>String(s.w).trim()!=="");
}
function blankDraft(dr){return dr.sets.every(s=>!String(s.a).trim()&&!String(s.w).trim())}

function items(t){
 if(t==="sleep")return [
  {id:"up",tm:"6:00 am",n:"Up",s:"Out of bed by 6"},
  {id:"bed",tm:"10:00 pm",n:"Lights out",s:"In bed by 10 for a full 8 hours"}];
 if(t==="diet")return [
  {id:"water",tm:"6:00 am",n:"Warm water"},
  {id:"coffee",tm:"8:00 am",n:"Coffee"},
  {id:"eggs",tm:"2:00 pm",n:"2 eggs and toast"},
  {id:"snack",tm:"3–4 pm",n:"Apple, pear, or banana"},
  {id:"whey",tm:"4–5 pm",n:"Whey and creatine",s:"During the workout"},
  {id:"oats",tm:"6:00 pm",n:"Oatmeal with berries and tea"},
  {id:"plate",tm:"8:00 pm",n:"Chicken or fish, dal, roti, sabzi"},
  {id:"vits",tm:"After dinner",n:"Omega-3, D3, B12, CoQ10, multivitamin"},
  {id:"kiwi",tm:"9:00 pm",n:"Kiwi and magnesium bisglycinate"},
  {id:"peg",tm:"If needed",n:"Restoralax",s:"Only if needed",opt:1}];
 if(t==="journal")return [
  {id:"lax",n:"Take laxative if needed",opt:1},
  {id:"dairy",n:"No dairy"},
  {id:"prep",n:"Prep food for tomorrow"},
  {id:"cold",n:"Testes cold therapy"},
  {id:"face",n:"Face wash"},
  {id:"brush",n:"Brush"},
  {id:"tape",n:"Breathing tape"},
  {id:"vas",n:"Vaseline"},
  {id:"loose",n:"Loose underwear"}];
 return [{id:"sex",n:"Intercourse",s:"Goal: 3 times a week"},{id:"ddp",n:"Deep deposit pause",s:"Practised it this time"}];
}
function prog(t,date){
 if(t==="workout"){const seq=daySeq(dkOf(date));return seq.length?seq.filter(x=>entryOn(x.inst.id,date)).length/seq.length:0}
 if(t==="fert")return isOn(t,date,"sex")?1:0;
 const req=items(t).filter(x=>!x.opt);
 if(!req.length)return 0;
 return req.filter(x=>isOn(t,date,x.id)).length/req.length;
}
const stat=(label,n,g,of)=>`<div class="stat"><b class="num${n>=g&&g>0?" met":""}">${n}<small> ${of||"/"} ${g}</small></b><span>${label}</span></div>`;
function ensureSel(){
 const tk=todayKey(),ds=DAYS.map(dateOf);
 if(!sel||!ds.includes(sel))sel=ds.includes(tk)?tk:ds[0];
 return ds;
}
function dayStrip(t){
 const tk=todayKey(),ds=ensureSel();
 return `<div class="wk" role="group" aria-label="Pick a day">${ds.map((d,i)=>{
  const p=prog(t,d);
  return `<button type="button" class="wd${d===tk?" td":""}${d>tk?" fu":""}" data-d="${d}" aria-pressed="${d===sel}"
   aria-label="${esc(shortDate(d))}, ${Math.round(p*100)}% done" onclick="pick('${d}')"><span>${DSHORT[DAYS[i]]}</span>
   <b class="num">${parseD(d).getDate()}</b><i class="bar"><i style="width:${Math.round(p*100)}%"></i></i></button>`;
 }).join("")}</div>`;
}
function nextId(t,date,its){
 if(date!==todayKey()||t==="fert")return null;
 const open=its.filter(x=>!x.opt&&!isOn(t,date,x.id));
 return open.length?open[0].id:null;
}
function checkRows(t,date,its){
 const fu=date>todayKey(),nx=nextId(t,date,its);
 return its.map(x=>{
  const on=isOn(t,date,x.id);
  return `<button type="button" class="ck${on?" on":""}${x.opt?" opt":""}${fu?" fu":""}" data-c="${t}|${date}|${x.id}" aria-pressed="${on}"${fu?" disabled":""}
   onclick="toggle('${t}','${date}','${x.id}')">${x.tm?`<span class="tm num">${esc(x.tm)}</span>`:""}
   <span><span class="nm">${esc(x.n)}${x.id===nx?'<span class="nx">Next</span>':""}</span>${x.s?`<span class="sb">${esc(x.s)}</span>`:""}</span>
   <span class="bx" aria-hidden="true">✓</span></button>`;
 }).join("");
}
function renderSleep(){
 const tk=todayKey(),ds=DAYS.map(dateOf);
 const head=`<div class="r hd"><div>Day</div><div>Up by 6</div><div>Lights out</div></div>`;
 const rows=ds.map(d=>{
  const dk=dkOf(d),cls=d===tk?" today":d>tk?" future":"";
  const tick=(id,short,label)=>{
   const on=isOn("sleep",d,id),fu=d>tk;
   return `<button type="button" class="tick${on?" on":""}" data-c="sleep|${d}|${id}" aria-pressed="${on}" aria-label="${esc(DNAME[dk]+", "+label+(on?", done":", not done"))}"${fu?" disabled":""}
     onclick="toggle('sleep','${d}','${id}')"><span class="bx" aria-hidden="true">✓</span>${short}</button>`;
  };
  return `<div class="r${cls}"${d===tk?' aria-current="date"':""}><div class="dc"><b>${DSHORT[dk]}</b><span class="num">${parseD(d).getDate()}</span></div>
   ${tick("up","6 am","up by 6")}${tick("bed","10 pm","lights out")}</div>`;
 }).join("");
 const n=id=>ds.filter(d=>isOn("sleep",d,id)).length;
 const full=ds.filter(d=>isOn("sleep",addDays(d,-1),"bed")&&isOn("sleep",d,"up")).length;
 return `<section class="pg"><p class="goal">${GOAL.sleep}</p>
  <div class="stats">${stat("Up by 6",n("up"),7)+stat("Lights out by 10",n("bed"),7)+stat("Full nights",full,7)}</div>
  <p class="note out">A full night is lights out, then up the next morning. Monday uses Sunday's lights out.</p>
  <div class="sw">${head}${rows}</div></section>`;
}
function renderPage(t){
 const tk=todayKey();ensureSel();
 const fu=sel>tk,its=items(t),rows=checkRows(t,sel,its);
 const list=`<div class="dh"><h2>${sel===tk?"Today":DNAME[dkOf(sel)]}</h2><span>${longDate(sel)}</span></div>
  <div class="list${t==="fert"?" nt":""}">${rows}${fu?`<p class="note">Ticks open on the day.</p>`:t==="diet"?`<p class="note">Dashed is only if needed. It does not count against the day.</p>`:""}</div>`;
 let stats,wkNote="";
 if(t==="diet"){
  const ds=DAYS.map(dateOf),req=its.filter(x=>!x.opt);
  const onPlan=ds.filter(d=>req.every(x=>isOn(t,d,x.id))).length;
  stats=stat("Days on plan",onPlan,7)+stat("Dinners",ds.filter(d=>isOn(t,d,"plate")).length,7);
 }else{
  const ds=DAYS.map(dateOf);
  const sx=ds.filter(d=>isOn(t,d,"sex")).length,dp=ds.filter(d=>isOn(t,d,"sex")&&isOn(t,d,"ddp")).length;
  stats=stat("Times this week",sx,3)+stat("With the pause",dp,sx,"of");
  if(weekOff===0){const left=Math.max(0,3-sx),dl=ds.filter(d=>d>=tk).length;
   wkNote=left?`${left} to go, ${dl} ${dl===1?"day":"days"} left`:"Goal met"}
 }
 return `<section class="pg"><p class="goal">${GOAL[t]}</p>${dayStrip(t)}${list}
  <div class="dh"><h2>${weekOff===0?"This week":"That week"}</h2><span>${wkNote}</span></div><div class="stats">${stats}</div></section>`;
}
function renderJournal(){
 const tk=todayKey(),ds=ensureSel(),fu=sel>tk,its=items("journal");
 const n=note(sel),prior=note(addDays(sel,-1)).p.trim();
 const plan=prior?`<div class="planbox"><b>Today's plan</b><p>${esc(prior)}</p></div>`:"";
 const rows=checkRows("journal",sel,its);
 const req=its.filter(x=>!x.opt);
 const closed=ds.filter(d=>req.every(x=>isOn("journal",d,x.id))).length;
 const noted=ds.filter(d=>note(d).r.trim()||note(d).p.trim()).length;
 return `<section class="pg"><p class="goal">${GOAL.journal}</p>${dayStrip("journal")}
  ${plan}
  <div class="field"><label for="jref">Day's reflection</label>
   <textarea id="jref" class="ta" placeholder="What stood out today" oninput="saveNote('${sel}','r',this.value)">${esc(n.r)}</textarea></div>
  <div class="field"><label for="jplan">Tomorrow's plan</label>
   <textarea id="jplan" class="ta" placeholder="What tomorrow needs" oninput="saveNote('${sel}','p',this.value)">${esc(n.p)}</textarea></div>
  <p class="st" id="nst" role="status"></p>
  <div class="dh"><h2>Checklist</h2><span>${sel===tk?"Today":longDate(sel)}</span></div>
  <div class="list nt">${rows}${fu?`<p class="note">Ticks open on the day. Notes can be written ahead.</p>`:`<p class="note">Dashed is only if needed. It does not count against the day.</p>`}</div>
  <div class="dh"><h2>${weekOff===0?"This week":"That week"}</h2></div>
  <div class="stats">${stat("Days closed",closed,7)+stat("Days with notes",noted,7)}</div></section>`;
}

function setTab(t){if(!TABNAME[t])return;tab=t;S.set("tab",t);sel=null;renderAll();window.scrollTo(0,0)}
function pick(d){sel=d;refocus=`[data-d="${d}"]`;renderAll()}
function toggle(t,date,id){
 if(date>todayKey())return;
 const all=chk(t),d=Object.assign({},all[date]);
 if(d[id])delete d[id];else d[id]=1;
 if(Object.keys(d).length)all[date]=d;else delete all[date];
 S.set("chk:"+t,all);refocus=`[data-c="${t}|${date}|${id}"]`;renderAll();
}
function saveNote(date,field,value){
 const n=note(date);n[field]=value;
 const ok=S.set("jr:"+date,n);
 const st=$("#nst");
 if(st){st.className=ok?"st":"st err";st.textContent=ok?"Saved":"Couldn't save in this browser."}
}

/* =================== ACTIONS =================== */
function goWeek(d){weekOff=d===0?0:Math.min(0,weekOff+d);sel=null;renderAll()}
function setWorkoutView(w){workoutWeek=!!w;renderAll()}
function openEx(dk,col,i){
 const inst=PLAN[dk][col][i];
 cur={dk,col,i,inst,id:inst.id,date:dateOf(dk)};msg=null;
 const future=cur.date>todayKey(),has=!future&&!!entryOn(cur.id,cur.date),last=!future&&lastNorm();
 focusAfter=future?"sheet":has?"sheet":last||QUICK.has(cur.id)?"pri":"a0";
 $("#app").inert=true;document.documentElement.style.overflow="hidden";renderAll();
}
function dismissSheet(){
 const key=cur?`[data-k="${cur.dk}|${cur.col}|${cur.i}"]`:"";
 cur=null;msg=null;$("#sheetRoot").innerHTML="";
 $("#app").inert=false;document.documentElement.style.overflow="";
 if(key)refocus=key;renderAll();
}
function closeSheet(){
 if(cur&&cur.date<=todayKey()){
  const k=draftKey(cur.id,cur.date),dr=drafts[k];
  if(dr&&dr.dirty){
   if(blankDraft(dr))delete drafts[k];
   else{
    const ok=save({closing:true});
    if(!ok){
     if(!confirm("This log isn't valid yet. Discard it and close?"))return;
     delete drafts[k];msg=null;
    }
   }
  }
 }
 dismissSheet();
}
function edit(i,f,v){
 const dr=draft();if(!dr.sets[i])return;dr.sets[i][f]=v;dr.dirty=true;msg=null;
 const st=$("#st");if(st){st.className="st";st.textContent="Unsaved changes"}
 const b=$("#pri");if(b){b.disabled=false;b.textContent="Save";b.className="btn pri"}
}
function fieldKey(e){if(e.key==="Enter"){e.preventDefault();primaryAction()}}
function addSet(){const dr=draft(),p=dr.sets[dr.sets.length-1];dr.sets.push({a:"",w:p?p.w:""});dr.dirty=true;msg=null;focusAfter="a"+(dr.sets.length-1);renderSheet()}
function rmSet(i){const dr=draft();dr.sets.splice(i,1);if(!dr.sets.length)dr.sets.push({a:"",w:""});dr.dirty=true;msg=null;focusAfter="sheet";renderSheet()}
function setMode(m){const dr=draft();if(dr.mode===m)return;dr.mode=m;dr.sets.forEach(s=>s.a="");dr.dirty=true;msg=null;focusAfter="a0";renderSheet()}
function fail(text){msg={err:true,text};focusAfter="pri";renderSheet();return false}
function nextOpen(){
 const {dk,col,i,date}=cur,seq=daySeq(dk);
 const at=seq.findIndex(x=>x.col===col&&x.i===i);
 const undone=k=>!entryOn(seq[k].inst.id,date);
 for(let k=at+1;k<seq.length;k++)if(undone(k))return seq[k];
 for(let k=0;k<at;k++)if(undone(k))return seq[k];
 return null;
}
function afterSave(){
 const n=nextOpen();
 if(n){openEx(n.dk,n.col,n.i);return}
 dismissSheet();
}
function save(opt){
 opt=opt||{};
 const {id,date}=cur;if(date>todayKey())return false;
 const dr=draft(),unit=unitOf(id),out=[];
 for(const [i,s] of dr.sets.entries()){
  const a=String(s.a).trim(),w=String(s.w).trim();
  if(!a&&!w)continue;
  let wv=null;
  if(w){wv=parseFloat(w.replace(",","."));if(!isFinite(wv)||wv<0||!/^\d*[.,]?\d*$/.test(w))return fail(`Set ${i+1}: enter a number of 0 or more in ${EX[id].wl||"lb"}, or leave it blank.`)}
  if(dr.mode==="time"){
   const t=parseT(a,unit);
   if(!t||!isFinite(t)||t<=0)return fail(`Set ${i+1}: enter the time in ${unit==="min"?"minutes":"seconds"}.`);
   out.push({t,w:wv});
  }else{
   const r=Number(a);
   if(!a||!Number.isSafeInteger(r)||r<1)return fail(`Set ${i+1}: enter whole reps above 0.`);
   out.push({reps:r,w:wv});
  }
 }
 if(!out.length)return fail(dr.mode==="time"?"Enter a time for at least one set.":"Enter reps for at least one set.");
 if(!writeLog(id,date,{d:date,unit:"lb",mode:dr.mode,sets:out}))return fail("Couldn't save in this browser. Your entries are still here, so try again.");
 S.set("mode:"+id,dr.mode);
 delete drafts[draftKey(id,date)];
 if(opt.closing)return true;
 afterSave();
 return true;
}
function primaryAction(){
 if(!cur||cur.date>todayKey())return;
 const dr=draft(),has=!!entryOn(cur.id,cur.date);
 if(dr.dirty)return save();
 if(!has&&lastNorm())return sameAsLast();
 if(!has&&QUICK.has(cur.id))return markDone();
 if(!has)return save();
}
function sameAsLast(){
 const n=lastNorm();if(!n)return;
 const d=toDraft(n,cur.id);d.dirty=true;
 drafts[draftKey(cur.id,cur.date)]=d;
 save();
}
function markDone(){
 const {id,date,inst}=cur;if(date>todayKey())return;
 const q=targetLog(inst,id);
 if(!writeLog(id,date,{d:date,unit:"lb",mode:q.mode,sets:q.sets,quick:true}))return fail("Couldn't save in this browser. Try again.");
 S.set("mode:"+id,q.mode);
 delete drafts[draftKey(id,date)];
 afterSave();
}
function quickToggle(dk,col,i){
 const inst=PLAN[dk][col][i],id=inst.id,date=dateOf(dk);
 if(date>todayKey())return;
 const e=entryOn(id,date);
 if(e){
  if(!e.quick&&!confirm("Delete this log?"))return;
  clearLog(id,date);
 }else{
  const q=targetLog(inst,id);
  if(!writeLog(id,date,{d:date,unit:"lb",mode:q.mode,sets:q.sets,quick:true}))return;
  S.set("mode:"+id,q.mode);
 }
 refocus=`[data-k="${dk}|${col}|${i}"]`;renderAll();
}
function del(){
 const {id,date}=cur;if(!confirm("Delete this log?"))return;
 clearLog(id,date);msg={text:"Log deleted"};focusAfter="sheet";renderAll();
}
function exportData(){
 const d={};
 for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
  if(k&&k.indexOf(K)===0){try{d[k.slice(K.length)]=JSON.parse(localStorage.getItem(k))}catch(e){}}}
 const b=new Blob([JSON.stringify(d,null,2)],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(b);a.download="health-log-"+todayKey()+".json";
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importData(inp){
 const f=inp.files&&inp.files[0];inp.value="";if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  let d;try{d=JSON.parse(r.result)}catch(e){alert("That file isn't a health log.");return}
  if(!d||typeof d!=="object"||Array.isArray(d)){alert("That file isn't a health log.");return}
  const keys=Object.keys(d).filter(k=>typeof k==="string"&&k&&k.length<80);
  if(!keys.length){alert("That file has no log entries.");return}
  if(!confirm("Replace the log in this browser with this file? This can't be undone."))return;
  const drop=[];
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(K)===0)drop.push(k)}
  drop.forEach(k=>localStorage.removeItem(k));
  for(const k of keys){if(!S.set(k,d[k])){alert("Couldn't save the import. Export a backup and try again.");break}}
  Object.keys(drafts).forEach(k=>delete drafts[k]);
  tab=S.get("tab","sleep");if(!TABNAME[tab])tab="sleep";
  sel=null;weekOff=0;cur=null;msg=null;renderAll();
 };
 r.readAsText(f);
}

document.addEventListener("keydown",e=>{if(e.key==="Escape"&&cur)closeSheet()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!cur)renderAll()});
matchMedia("(min-width:640px)").addEventListener("change",()=>{if(!cur)renderAll()});
renderAll();
</script>
</body>
