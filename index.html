<style>
/* Minimal look: one ink, one accent, hairlines instead of boxes. */
:root{
  color-scheme:light dark;
  --bg:#fbfaf8;--card:#fff;--line:#eceae4;--bd:#d9d6ce;--text:#1a1917;--t2:#67645c;--t3:#b3afa6;
  --acc:#2f6f5e;--alert:#a14545;
  --ink:#1a1917;--on-ink:#fff;--on:#fff;
  --shade:rgba(26,25,23,.4);--toast:#1a1917;--toast-t:#f4f2ee;--toast-a:#8fd3bd;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121211;--card:#1b1b19;--line:#262522;--bd:#3d3b37;--text:#efede8;--t2:#a29f97;--t3:#5f5c56;
    --acc:#6cbfa6;--alert:#e39494;
    --ink:#efede8;--on-ink:#121211;--on:#121211;--shade:rgba(0,0,0,.6);--toast:#efede8;--toast-t:#1a1917;--toast-a:#2f6f5e}
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;background:var(--bg)}
html.lock,html.lock body{overflow:hidden}
body{background:var(--bg);color:var(--text);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button:disabled{cursor:default;opacity:.35}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 22px) max(20px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 100px) max(20px,env(safe-area-inset-left))}
.pg{display:flex;flex-direction:column;gap:24px}
h1{font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.025em}
h2{font-size:16px;line-height:1.3;font-weight:600}
.intro{font-size:15px;line-height:1.45;color:var(--t2);margin-top:6px}
.intro.bad{color:var(--alert);font-weight:600}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}
.ch>span{font-size:13.5px;color:var(--t2);text-align:right}
.lnk{flex-shrink:0;min-height:44px;padding:0 6px;font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--bd)}
.note{font-size:13.5px;line-height:1.45;color:var(--t2);margin-top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.links{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 18px}
.links .lnk{color:var(--t2);font-weight:500}

.btn{min-height:48px;padding:0 18px;border:1px solid var(--bd);border-radius:12px;font-size:15.5px;font-weight:600}
.btn.ink{flex:1;border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.btn.wide{display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.dash{border-style:dashed;margin-top:12px}
.xb{width:44px;height:44px;flex-shrink:0;border-radius:10px;color:var(--t2);font-size:22px;line-height:1}

/* goal page: one line per target, with where it stands and a way in */
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--acc)}
.gl{display:flex;align-items:center;gap:10px;width:100%;min-height:62px;padding:8px 0;text-align:left;border-top:1px solid var(--line)}
.grp+.gl{border-top:0}
.gl .tt b{font-size:16px;font-weight:600}
.gl .tt small{font-size:13px}
.gs{flex-shrink:0;max-width:44%;font-size:13.5px;line-height:1.3;color:var(--t2);text-align:right}
.gs.ok{color:var(--acc);font-weight:600}
.gs.bad{color:var(--alert);font-weight:600}
.gl>svg{width:16px;height:16px;color:var(--t3)}
.gl>i{width:16px;flex-shrink:0}

/* week and day switcher */
.wkn{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wkn h2{flex:1;text-align:center;font-size:15px}
.wkn button{display:grid;place-items:center;width:44px;height:44px;border-radius:999px;color:var(--text)}
.wkn button svg{width:20px;height:20px}
.wkn+*{margin-top:6px}

/* tick rows */
.ck{flex-shrink:0;display:grid;place-items:center;width:22px;height:22px;border-radius:999px;border:1.5px solid var(--bd);color:var(--on)}
.ck svg{width:13px;height:13px;stroke-width:3}
.tl{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;text-align:left;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.tl.on .ck{background:var(--acc);border-color:var(--acc)}
.tt{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.tt b{font-size:15px;font-weight:500}
.tt small{font-size:12.5px;line-height:1.35;color:var(--t2)}
.tm{flex-shrink:0;font-size:12.5px;color:var(--t2);white-space:nowrap}
.tl.on .tt b{color:var(--t2)}
.none{font-size:14.5px;color:var(--t2);padding:10px 0}
.tl.sm{min-height:46px}
.grp{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--t2);padding:14px 0 2px}
.ch+.grp{padding-top:2px}

/* inputs */
.lb{display:block;font-size:13px;font-weight:600;color:var(--t2);margin:0 0 6px}
.inp{display:block;width:100%;min-height:46px;padding:0 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);font-size:16px}
.inp:focus{outline:2px solid var(--acc);outline-offset:1px}
.tin{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg2 button{min-height:46px;border:1px solid var(--bd);border-radius:10px;font-weight:600;font-size:15px}
.seg2 button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.seg2 .bl{color:var(--alert)}
.seg2 .bl[aria-pressed="true"]{border-color:var(--alert);background:var(--alert);color:var(--on)}

/* sleep */
.big{font-size:44px;line-height:1;font-weight:700;letter-spacing:-.03em;margin-top:18px}
.big.ok{color:var(--acc)}
.big small{font-size:14px;font-weight:500;letter-spacing:0;color:var(--t2);margin-left:8px}
.n7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.n7 button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:68px;border-radius:10px}
.n7 small{font-size:11px;font-weight:600;color:var(--t2)}
.n7 b{font-size:13.5px;font-weight:600}
.n7 b.ok{color:var(--acc)}
.n7 b.no{color:var(--t3);font-weight:400}
.n7 i{font-style:normal;font-size:11px;line-height:1.2;min-height:13px;color:var(--t2)}
.n7 button[aria-pressed="true"]{background:var(--card);box-shadow:inset 0 0 0 1px var(--bd)}

/* stool log */
.er{display:flex;align-items:center;gap:12px;min-height:50px;border-top:1px solid var(--line);font-size:15px}
.er:first-child{border-top:0}
.er .num{width:76px;flex-shrink:0;color:var(--t2);font-size:13.5px}
.er b{font-weight:600}
.er span.s{flex:1;color:var(--t2);font-size:14px}
.er.bl span.s{color:var(--alert);font-weight:600}
.bf{display:flex;flex-direction:column;gap:14px}
.ers{margin-top:14px}
.bt7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.bt7 button{min-height:46px;border:1px solid var(--bd);border-radius:10px;font-size:16px;font-weight:700}
.bt7 button[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.bf .note{margin-top:-6px}

/* diet plan editor */
.ed{display:grid;grid-template-columns:112px minmax(0,1fr) 40px;gap:8px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.ed:first-child{border-top:0}
.ed>span{display:flex;flex-direction:column;gap:6px;min-width:0}
.ed .inp{padding:0 10px}
.ed .inp.sm{min-height:38px;font-size:14.5px;color:var(--t2)}
.ed .xb{width:40px;height:46px}
.ed input[type="time"]::-webkit-calendar-picker-indicator{display:none}

/* workout plan editor */
.we{padding:10px 0;border-top:1px solid var(--line)}
.we:first-child{border-top:0}
.wen{display:flex;gap:6px}
.wen .inp{flex:1;min-width:0}
.wen .xb{width:40px;height:46px}
.wet{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px;padding-right:46px}
.wet label{display:flex;flex-direction:column;gap:2px}
.wet span{font-size:11px;font-weight:600;color:var(--t2);text-align:center}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-items:start;background:var(--bg);border-top:1px solid var(--line);padding:6px max(2px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 2px) max(2px,env(safe-area-inset-left))}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;min-height:56px;padding:4px 0 0;font-size:10px;line-height:1.15;font-weight:500;color:var(--t2);text-align:center;overflow:hidden}
.tabs button[aria-current="page"]{color:var(--text);font-weight:700}
.tabs svg{width:22px;height:22px;stroke-width:1.6}
.tabs button[aria-current="page"] svg{stroke-width:2}

/* bottom sheet */
.shade{position:fixed;inset:0;background:var(--shade);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--bg);color:var(--text);border-radius:20px 20px 0 0;
       max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
       padding:8px 20px calc(env(safe-area-inset-bottom) + 20px);box-shadow:0 -8px 30px rgba(0,0,0,.12);animation:up .22s ease-out}
.sheet:focus{outline:none}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--bd);margin:0 auto 14px}
.sh{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.sh h2{font-size:21px;font-weight:700;letter-spacing:-.015em;line-height:1.25}
.sh p{font-size:13.5px;color:var(--t2);margin-top:2px}
.x{margin-left:auto;width:44px;height:44px;flex-shrink:0;border-radius:50%;color:var(--t2);font-size:24px;line-height:1}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.box.tint{border-radius:12px;background:var(--card);padding:12px 14px}
.rule{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:14.5px;line-height:1.4}
.rule::before{content:"";flex:none;width:4px;height:4px;border-radius:999px;background:var(--t3);margin-top:9px}
.tmr{font-size:34px;line-height:1;font-weight:700;letter-spacing:-.02em;color:var(--text)}

/* matrix: rows down the side, days across the top */
.mx{width:100%;border-collapse:collapse;table-layout:fixed}
.mx col.c0{width:40%}
.mx thead th{height:30px;font-size:12px;font-weight:600;color:var(--t2);text-align:center}
.mx thead th.t{color:var(--text);font-weight:800}
.mx tbody th{padding:0;text-align:left;font-weight:500;border-top:1px solid var(--line)}
.mx tbody th button,.mx tbody th>span{display:flex;flex-direction:column;justify-content:center;width:100%;min-height:46px;text-align:left;font-size:14.5px;line-height:1.25}
.mx tbody th small{font-size:12px;color:var(--t2);font-weight:400}
.mx td{padding:0;height:46px;text-align:center;border-top:1px solid var(--line)}
.mx .t{background:var(--card)}
.mx td button,.mx td>span{display:grid;place-items:center;width:100%;height:46px}
.mk{display:grid;place-items:center;width:22px;height:22px;border-radius:999px;border:1.5px solid var(--bd);color:var(--on)}
.mk svg{width:12px;height:12px;stroke-width:3}
.mk.on{background:var(--acc);border-color:var(--acc)}
.mk.due{border-color:var(--text)}
.mk.rest{border:0;width:10px;height:1.5px;border-radius:1px;background:var(--t3)}
.mk.pl.on{background:var(--text);border-color:var(--text)}
.mx tr.gh th{height:34px;border-top:1px solid var(--line);font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--t2);vertical-align:bottom;padding-bottom:4px}
.mx thead th button{width:100%;height:30px;font:inherit;color:inherit}
.mx.lg col.c0{width:36%}
.mx.lg td{padding:4px 3px;height:52px}
.mx.ej col.c0{width:22%}
.mx.ej thead th{height:44px;line-height:1.25}
.mx.ej thead th small{display:block;font-size:11px;font-weight:400}
.mx.ej td,.mx.ej td button,.mx.ej td>span{height:56px}
.mx.ej tbody th>span{min-height:56px;font-weight:600}
.wi{display:block;width:100%;min-height:42px;padding:0 2px;border:1px solid var(--bd);border-radius:9px;background:var(--card);text-align:center;font-size:16px;font-variant-numeric:tabular-nums}
.wi::placeholder{color:var(--t3)}
.wi:focus{outline:2px solid var(--acc);outline-offset:1px}
.wi:disabled{opacity:.5}
.na{color:var(--t3)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 78px);z-index:60;display:flex;align-items:center;gap:14px;
       width:max-content;max-width:calc(100% - 24px);min-height:46px;padding:6px 8px 6px 16px;border-radius:12px;background:var(--toast);color:var(--toast-t);
       font-size:14.5px;box-shadow:0 8px 24px rgba(0,0,0,.2);transform:translate(-50%,16px);opacity:0;visibility:hidden;
       transition:opacity .18s,transform .18s,visibility 0s .18s}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .18s,transform .18s}
.toast button{min-height:36px;padding:0 12px;border-radius:8px;color:var(--toast-a);font-size:14.5px;font-weight:700}
</style>
</head>

<div id="app" class="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="sheetRoot"></div>
<input id="imp" type="file" accept="application/json,.json" hidden onchange="importData(this)">
<script>
"use strict";
/* Five tabs, nothing else (Nov 14, 2026):
   1 Sleep · 2 Prevent Blood in Stool · 3 Diet and Supplements (with tomorrow's plan) · 4 Workout (unchanged) · 5 Ejaculation (plan and actual).
   No reminders, no notices, no evening lock, no "close the day": every tab is just its log.
   Every log keeps the bt26: keys of the earlier versions, so existing entries and backups load unchanged:
   sleep:<date> · gut:stools:<date> · gut:diet:<date> (ticks) · wo:<date> · fert:<date> (rel = actual, plan = planned).
   New: plan:<date> is the diet list for that day; a day without its own list uses the most recent earlier one.
   Nov 14, later: sleep score on Sleep; Stool opens with the Discipline ticks (mechanics, diet, proactive management);
   bedtime is kiwi + turmeric tea; the workout plan can be edited (wp:<date>: the day's kind and its exercise lists).
   Goal tab (Nov 14): the home page. The 90-day goal in his words, "Sperm Maxxing: nothing else matters", as two jobs:
   stop the loss (no blood in stool) and build it up (sleep, nutrition, no mental stress, no oxidative stress).
   Each line shows where it stands today and opens its tab. The app lands here on opening and after 5 minutes away. */

/* =================== STORE & DATES =================== */
const K="bt26:";
const S={
 get(k,d){try{const v=localStorage.getItem(K+k);return v===null?d:JSON.parse(v)}catch(e){return d}},

  if(v===""){delete o.score}
  else if(Number.isInteger(n)&&n>=0&&n<=100)o.score=n;
  else{toast("Sleep score is 0 to 100.");renderAll();return}
  if(!o.sleep&&!o.wake&&(o.score==null||o.score==="")&&!o.note)S.del(k);else S.set(k,o);
  renderAll()},
 plt:t=>{planEdit(t,"t",toMin(t.value)!=null?hhmm(toMin(t.value)):"");renderAll()}
};
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
 const fn=ACT[b.dataset.act];if(fn){e.preventDefault();fn(b.dataset,b)}
});
document.addEventListener("input",e=>{const t=e.target;if(t&&t.dataset&&t.dataset.in&&IN[t.dataset.in])IN[t.dataset.in](t)});
document.addEventListener("change",e=>{const t=e.target;if(t&&t.dataset&&t.dataset.ch&&CHG[t.dataset.ch])CHG[t.dataset.ch](t)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheet)closeSheetNow()});

/* workout timer */
const fmtLeft=ms=>{const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+":"+pad(s%60)};
function stopTimer(silent){timer=null;if(!silent)renderAll()}
function tickTimer(){
 if(!timer)return;
 const left=timer.end-Date.now();
 document.querySelectorAll("[data-tmr]").forEach(el=>{el.textContent=fmtLeft(left)});
 if(left<=0&&!timer.done){timer.done=true;toast("Time's up. Tap Done.");try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}}
}
setInterval(tickTimer,1000);

/* =================== TOAST & UNDO =================== */
let toastT=null,toastUndo=null;
function toast(text,undo){
 const t=$("#toast");if(!t)return;
 toastUndo=undo||null;
 t.innerHTML=`<span>${esc(text)}</span>${undo?`<button type="button" onclick="undoToast()">Undo</button>`:""}`;
 t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(hideToast,undo?6000:2600);
}
function hideToast(){const t=$("#toast");if(t)t.classList.remove("show");toastUndo=null}
function undoToast(){const u=toastUndo;hideToast();if(u){u();toast("Undone")}}
/* remembers the stored value of a few keys, and returns a function that puts them back */
function keep(...keys){
 const prev=keys.map(k=>{let v=null;try{v=localStorage.getItem(K+k)}catch(e){}return [k,v]});
 return ()=>{prev.forEach(([k,v])=>{try{v===null?localStorage.removeItem(K+k):localStorage.setItem(K+k,v)}catch(e){}});planDates=null;wpIdx=null;renderAll();if(sheet)renderSheet()};
}

/* =================== SHEETS =================== */
let sheet=null,sh=null,sheetReturn=null;
function openSheet(kind,state){
 sheet=kind;sh=state||{};sheetReturn=document.activeElement;
 $("#app").inert=true;document.documentElement.classList.add("lock");
 renderSheet("sheet");
}
function renderSheet(focusId){
 const root=$("#sheetRoot");
 if(!sheet){root.innerHTML="";return}
 let el=$("#sheet");
 if(!el){root.innerHTML=`<div class="shade" data-act="x"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT" tabindex="-1"></div>`;el=$("#sheet")}
 const top=el.scrollTop;
 el.innerHTML=`<div class="grab" aria-hidden="true"></div>`+(SHEETS[sheet]?SHEETS[sheet]():"");
 el.scrollTop=top;
 if(focusId){const t=focusId==="sheet"?el:document.getElementById(focusId)||el;try{t.focus({preventScroll:t===el})}catch(e){t.focus()}}
}
function closeSheetNow(){
 const back=sheetReturn;
 sheet=null;sh=null;sheetReturn=null;
 $("#sheetRoot").innerHTML="";
 $("#app").inert=false;document.documentElement.classList.remove("lock");
 renderAll();
 if(back&&back.dataset&&back.dataset.act){
  const sig=`[data-act="${back.dataset.act}"]`+["k","id","d","v"].map(f=>back.dataset[f]!=null?`[data-${f}="${back.dataset[f]}"]`:"").join("");
  try{const el=$("#app").querySelector(sig);if(el)el.focus({preventScroll:true})}catch(e){}
 }
}
function confirmAsk(o){openSheet("ask",{title:o.title,text:o.text,ok:o.ok,run:o.run})}
const head=(title,sub)=>`<div class="sh"><div><h2 id="shT">${esc(title)}</h2>${sub?`<p>${esc(sub)}</p>`:""}</div><button type="button" class="x" data-act="x" aria-label="Close">×</button></div>`;
const SHEETS={
 ask:()=>`${head(sh.title)}<p style="font-size:15px;line-height:1.45;color:var(--t2)">${esc(sh.text)}</p>
  <div class="acts"><button type="button" class="btn" data-act="x">Cancel</button><button type="button" class="btn ink" data-act="askOk">${esc(sh.ok)}</button></div>`,
 how:()=>{const st=woStep(sh.date,sh.id);if(!st||!st.how)return head("Not on today's list");
  const run=timer&&timer.id===st.id,isT=sh.date===todayKey();
  const cust=exStored(sh.date),skip=HOW_EX[st.kind]||[];
  const lines=cust?[cust.filter(x=>x.n.trim()).map(exLine).join(" · ")].filter(Boolean).concat(st.how.filter((_,i)=>!skip.includes(i))):st.how;
  return `${head(st.name,wdmd(sh.date))}<div class="box tint">${lines.map(x=>`<p class="rule">${esc(x)}</p>`).join("")}</div>
  ${isT&&st.timer?`${run?`<p class="tmr num" data-tmr style="margin-top:14px;text-align:center">${fmtLeft(timer.end-Date.now())}</p>`:""}
   <div class="acts">${run?`<button type="button" id="hw_stop" class="btn" data-act="stoptimer">Stop</button>`:`<button type="button" id="hw_start" class="btn ink" data-act="timer" data-id="${st.id}" data-v="${st.timer}">Start ${st.timer}:00</button>`}
    <button type="button" class="btn ink" data-act="howDone">Done</button></div>`:""}`}
};

/* =================== BACKUP =================== */
function allData(){const d={};S.keys().forEach(k=>{try{d[k]=JSON.parse(localStorage.getItem(K+k))}catch(e){}});return d}
function downloadFile(text,name){
 const b=new Blob([text],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
/* on iPhone this opens the share sheet, so "Save to Files", AirDrop or Messages all work */
async function exportData(){
 const tk=todayKey(),d=allData();d.lastexport=tk;
 const name="health-log-"+tk+".json",json=JSON.stringify(d,null,1);
 let file=null;try{file=new File([json],name,{type:"application/json"})}catch(e){}
 let canFile=false;try{canFile=!!(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]}))}catch(e){}
 if(canFile){
  try{await navigator.share({files:[file],title:"Five Pillars backup"});S.set("lastexport",tk);toast("Backup saved")}
  catch(e){if(!e||e.name!=="AbortError"){downloadFile(json,name);S.set("lastexport",tk)}}
  return;
 }
 downloadFile(json,name);S.set("lastexport",tk);toast("Backup downloaded");
}
const KNOWN=/^(plan:|wp:|wo:|lift:|mode:|sleep:|gut:|fert:|wchk:|jr:|day:|wrev:|fview$|wview$|lastexport$|wake$|iron$|funlist$|funbig$|tests$|setup$|ifthen$|planFrom$|v2From$|v3From$|v4From$|v2seen$)/;
function importData(inp){
 const f=inp.files&&inp.files[0];inp.value="";if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  let d;try{d=JSON.parse(r.result)}catch(e){toast("That file isn't a backup from this app.");return}
  if(!d||typeof d!=="object"||Array.isArray(d)){toast("That file isn't a backup from this app.");return}
  const keys=Object.keys(d).filter(k=>k&&k.length<80&&KNOWN.test(k));
  if(!keys.length){toast("That file has no log entries.");return}
  const when=isDate(d.lastexport)?" from "+wdmd(d.lastexport):"";
  confirmAsk({title:"Restore this backup?",ok:"Replace",run:()=>doImport(d,keys),
   text:`This replaces everything in the app with the backup${when} (${keys.length} entries). You can undo right after.`});
 };
 r.onerror=()=>toast("Couldn't read that file.");
 r.readAsText(f);
}
function snapshotAll(){
 const snap={};S.keys().forEach(k=>{try{snap[k]=localStorage.getItem(K+k)}catch(e){}});
 return ()=>{S.keys().forEach(k=>{if(!(k in snap))S.del(k)});
  Object.keys(snap).forEach(k=>{try{localStorage.setItem(K+k,snap[k])}catch(e){}});planDates=null;wpIdx=null;renderAll()};
}
function doImport(d,keys){
 const undo=snapshotAll();
 S.keys().forEach(k=>S.del(k));
 for(const k of keys){if(!S.set(k,d[k])){undo();toast("Couldn't restore: this browser is out of space. Nothing changed.");return}}
 if(!isDate(S.get("v4From",null)))S.set("v4From",V4_FROM);
 planDates=null;wpIdx=null;renderAll();toast("Backup restored",undo);
}

/* =================== START =================== */
/* home-screen apps stay suspended overnight: jump to the new day when the app comes back */
let hiddenAt=0;
function goHome(){
 dietEdit&&endEdit();woEdit&&endWoEdit();
 tab="goal";sel=todayKey();wkOff=0;woSel=null;ejOff=0;dietDay=0;bmF={time:null,type:4,blood:false};
}
function checkDay(){
 const tk=todayKey(),away=hiddenAt?Date.now()-hiddenAt:0;hiddenAt=0;
 /* a new day, or back after 5 minutes or more: open on the goal */
 if(tk!==lastTk||away>=300000){lastTk=tk;if(sheet)closeSheetNow();goHome();renderAll();window.scrollTo(0,0);return}
 const ae=document.activeElement,typing=ae&&ae.tagName==="INPUT";
 if(!sheet&&!typing&&!dietEdit&&!woEdit)renderAll();
}
document.addEventListener("visibilitychange",()=>{if(document.hidden)hiddenAt=Date.now();else checkDay()});
window.addEventListener("pageshow",checkDay);
setInterval(()=>{if(!document.hidden&&todayKey()!==lastTk)checkDay()},30000);
/* ask Safari to keep this app's storage (iPhone and iPad only; elsewhere it can trigger a prompt) */
try{if(navigator.standalone!==undefined&&navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
renderAll();
</script>
