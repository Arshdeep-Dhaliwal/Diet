<style>
:root{
  color-scheme:light dark;
  --bg:#faf9f7;--card:#fff;--bd:#e7e4de;--bd2:#d5d1c8;--line:#f0ede7;--text:#1c1b19;--t2:#5f5c55;
  --gut:#2f6f5e;--gut-bg:#e8f2ee;--gut-t:#2f6f5e;
  --sleep:#5a55c9;--sleep-bg:#ecebfb;--sleep-t:#5a55c9;
  --calm:#4f6f8f;--calm-bg:#e9eff5;--calm-t:#4f6f8f;
  --move:#b8641c;--move-bg:#fbefe3;--move-t:#a3561a;
  --feb:#a8406f;--feb-bg:#f8e9f0;--feb-soft:#efd6e1;
  --amb:#7d5615;--amb-bg:#fbf2e1;
  --alert:#a14545;--alert-bg:#f9ecec;
  --ink:#1c1b19;--on-ink:#fff;--on:#fff;
  --shade:rgba(28,27,25,.42);--toast:#1c1b19;--toast-t:#f4f2ee;--toast-a:#8fd3bd;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141413;--card:#1d1d1b;--bd:#2d2c29;--bd2:#45433e;--line:#272623;--text:#f0eee9;--t2:#a6a39b;
    --gut:#6cbfa6;--gut-bg:#1d2b26;--gut-t:#6cbfa6;--sleep:#a29ef2;--sleep-bg:#24233d;--sleep-t:#a29ef2;
    --calm:#93b2d0;--calm-bg:#1e2833;--calm-t:#93b2d0;--move:#eda066;--move-bg:#2e2318;--move-t:#eda066;
    --feb:#ec8fb8;--feb-bg:#33202a;--feb-soft:#4a2c3a;--amb:#dcae62;--amb-bg:#2b2519;--alert:#e39494;--alert-bg:#301e1e;
    --ink:#f0eee9;--on-ink:#141413;--on:#141413;--shade:rgba(0,0,0,.6);--toast:#f0eee9;--toast-t:#1c1b19;--toast-a:#2f6f5e}
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;background:var(--bg)}
html.lock,html.lock body{overflow:hidden}
html.nightmode,html.nightmode body{background:#141413}
body{background:var(--bg);color:var(--text);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
html.nightmode body{color:#f0eee9}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button:disabled{cursor:default;opacity:.5}
:focus-visible{outline:2px solid var(--gut-t);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 108px) max(16px,env(safe-area-inset-left))}
html.nightmode .app{max-width:none;padding:0}
.pg{display:flex;flex-direction:column;gap:12px}
h1{font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
h2{font-size:16px;line-height:1.3;font-weight:700}
.intro{font-size:15px;line-height:1.45;color:var(--t2)}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hdr>div{min-width:0}
.dl{font-size:13px;color:var(--t2);margin-bottom:2px}
.bpill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:999px;background:var(--feb-bg);color:var(--feb);font-size:13px;font-weight:700;white-space:nowrap}
.bpill svg{width:16px;height:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.ch>span{font-size:13px;color:var(--t2);text-align:right}
.kick{font-size:12px;font-weight:800;letter-spacing:.06em}
.viewing{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 6px 4px 14px;border-radius:12px;background:var(--amb-bg);color:var(--amb);font-size:14px;font-weight:600}
.lnk{min-height:44px;padding:0 8px;color:var(--gut-t);font-weight:700;font-size:14px}
.gut{--c:var(--gut);--cb:var(--gut-bg);--ct:var(--gut-t)}
.sleep{--c:var(--sleep);--cb:var(--sleep-bg);--ct:var(--sleep-t)}
.calm{--c:var(--calm);--cb:var(--calm-bg);--ct:var(--calm-t)}
.move{--c:var(--move);--cb:var(--move-bg);--ct:var(--move-t)}
.feb{--c:var(--feb);--cb:var(--feb-bg);--ct:var(--feb)}
.amb{--c:var(--amb);--cb:var(--amb-bg);--ct:var(--amb)}

/* priority 1 banner */
.hero{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:16px;background:var(--gut-bg)}
.hero>svg{width:30px;height:30px;color:var(--gut-t)}
.ht{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.ht b{font-size:18px;font-weight:800;color:var(--gut-t)}
.ht span{font-size:13px;color:var(--t2)}
.hb{flex-shrink:0;min-height:44px;padding:0 14px;border-radius:12px;background:var(--gut-t);color:var(--on);font-size:14px;font-weight:700}
.hero.bad{background:var(--alert-bg)}
.hero.bad>svg,.hero.bad b{color:var(--alert)}

/* the four pillars */
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px 0;border-radius:12px}
.pri{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--ct)}
.clm{display:flex;flex-direction:column;width:100%}
.clm .cap{display:block;height:8px;border-radius:4px;background:var(--c)}
.clm .shaft{position:relative;display:block;margin:0 8px;height:92px;background:var(--cb);overflow:hidden}
.clm .fill{position:absolute;left:0;right:0;bottom:0;background:var(--c);transition:height .35s ease}
.pn{font-size:15px;font-weight:700}
.pc{font-size:12px;color:var(--t2)}

/* rows */
.lnr,.tl,.swr,.trow,.fr,.ms,.ph,.wkr{border-top:1px solid var(--line)}
.ch+.lnr,.ch+.tl,.ch+.swr,.ch+.trow,.ch+.fr,.ch+.ph,.grp+.fr,.ch+.wkr,.ch+.ms{border-top:0}
.lnr{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;text-align:left}
.ck{flex-shrink:0;display:grid;place-items:center;width:28px;height:28px;border-radius:999px;border:2px solid var(--bd2);color:var(--on)}
.ck svg{width:16px;height:16px;stroke-width:3}
.lnr.ok .ck{background:var(--sleep-t);border-color:var(--sleep-t)}
.lt{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.lt b{font-size:15px;font-weight:600}
.lt small{font-size:13px;color:var(--t2)}
.yn{display:flex;gap:8px;flex-shrink:0}
.yn button{min-width:54px;min-height:44px;border:1px solid var(--bd2);border-radius:10px;font-size:15px;font-weight:600}
.yn button[aria-pressed="true"]{background:var(--sleep-t);border-color:var(--sleep-t);color:var(--on)}
.yn button.no[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg)}
.sbtn{flex-shrink:0;min-height:44px;padding:0 16px;border-radius:10px;background:var(--sleep-t);color:var(--on);font-weight:700;font-size:15px}

/* now card */
.now{display:flex;flex-direction:column;gap:10px;padding:18px 16px 16px;border-radius:20px;background:var(--cb)}
.nk{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--ct)}
.nk span{padding:3px 9px;border-radius:999px;background:var(--card);letter-spacing:0;font-weight:700}
.now h2{font-size:22px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
.now p{font-size:14px;line-height:1.45;color:var(--t2)}
.now ul{padding-left:18px;font-size:14px;line-height:1.45;color:var(--t2)}
.nb{display:flex;gap:10px;flex-wrap:wrap}
.btn{min-height:50px;padding:0 18px;border:1px solid var(--bd2);border-radius:12px;background:var(--card);font-size:16px;font-weight:600}
.btn.pri{flex:1;border:0;background:var(--ct,var(--gut-t));color:var(--on);font-weight:700}
.btn.ink{flex:1;border:0;background:var(--ink);color:var(--on-ink);font-weight:700}
.btn.del{color:var(--alert)}
.tmr{font-size:34px;line-height:1;font-weight:800;letter-spacing:-.02em;color:var(--ct)}
.cta{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 16px;border-radius:14px;background:var(--ink);color:var(--on-ink);text-align:left}
.cta svg{width:22px;height:22px}
.cta span{flex:1;display:flex;flex-direction:column}
.cta b{font-size:17px;font-weight:700}
.cta small{font-size:13px;opacity:.8}
.cta.soft{background:var(--amb-bg);color:var(--amb)}
.cta.soft small{opacity:1}
.warn{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:16px;background:var(--amb-bg);color:var(--amb)}
.warn div{flex:1;display:flex;flex-direction:column}
.warn b{font-size:15px}
.warn small{font-size:13px}
.warn button{min-height:44px;padding:0 14px;border-radius:12px;background:var(--amb);color:var(--card);font-weight:700;font-size:14px}

/* timeline */
.tl{display:flex;align-items:center;gap:10px;width:100%;min-height:60px;padding:6px 0;text-align:left}
.tl .ck{width:26px;height:26px}
.tl.on .ck{background:var(--ct);border-color:var(--ct)}
.tl.auto .ck{border-style:dashed}
.tl.auto.on .ck{border-style:solid}
.tm{width:72px;flex-shrink:0;font-size:12.5px;color:var(--t2);white-space:nowrap}
.tt{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.tt b{font-size:15px;font-weight:600}
.tt small{font-size:12.5px;line-height:1.35;color:var(--t2)}
.tl.on .tt b{color:var(--t2)}
.tg{flex-shrink:0;font-size:12px;font-weight:700;color:var(--ct)}
.tl.off{opacity:.7}
.tl.off .ck{visibility:hidden}
.rowbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-size:15px;font-weight:600}
.links{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 18px}

/* bowel movements */
.bmrow{display:flex;flex-wrap:wrap;gap:8px}
.bmc{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);font-size:14px}
.bmc b{font-weight:700}
.bmc.flag{border-color:var(--alert);color:var(--alert)}
.bmc.add{border-style:dashed;color:var(--gut-t);font-weight:700}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start;background:var(--card);border-top:1px solid var(--bd);padding:6px max(4px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(4px,env(safe-area-inset-left))}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;padding-top:2px;font-size:11px;font-weight:600;color:var(--t2)}
.tabs button[aria-current="page"]{color:var(--text);font-weight:800}
.tabs svg{width:24px;height:24px}
.tabs .plus{justify-self:center;display:grid;place-items:center;width:56px;height:56px;min-height:0;margin-top:-20px;padding:0;border-radius:999px;background:var(--ink);color:var(--on-ink);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tabs .plus svg{width:26px;height:26px;stroke-width:2.4}

/* bottom sheet */
.shade{position:fixed;inset:0;background:var(--shade);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--card);color:var(--text);border-radius:18px 18px 0 0;
       max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
       padding:8px 18px calc(env(safe-area-inset-bottom) + 18px);box-shadow:0 -8px 30px rgba(0,0,0,.15);animation:up .22s ease-out}
.sheet:focus{outline:none}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.sw,.sw i,.clm .fill{transition:none}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--bd2);margin:0 auto 12px}
.sh{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.sh h2{font-size:20px;font-weight:800;letter-spacing:-.015em;line-height:1.25}
.sh p{font-size:13.5px;color:var(--t2);margin-top:2px}
.x{margin-left:auto;width:44px;height:44px;flex-shrink:0;border-radius:50%;background:var(--bg);color:var(--t2);font-size:22px;line-height:1}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.sec{font-size:15px;font-weight:700;margin:16px 0 8px}
.lb{display:block;font-size:13px;font-weight:700;color:var(--t2);margin:14px 0 6px}
.inp{display:block;width:100%;min-height:46px;padding:0 12px;border:1px solid var(--bd2);border-radius:10px;background:var(--bg);font-size:16px}
textarea.inp{min-height:84px;padding:10px 12px;resize:vertical;line-height:1.4}
.inp:focus{outline:2px solid var(--gut-t);outline-offset:1px}
.tin{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.note{font-size:13px;line-height:1.45;color:var(--t2);margin-top:8px}
.note.bad{color:var(--alert);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--amb-bg);color:var(--amb);font-size:13px;font-weight:700}
.pill svg{width:15px;height:15px}
.box{border:1px solid var(--bd);border-radius:14px;padding:2px 4px 2px 14px;background:var(--card)}
.box.tint{background:var(--bg);border-color:transparent;padding:10px 14px}
.qk{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;text-align:left;border-top:1px solid var(--line)}
.qk:first-of-type{border-top:0}
.qk .qi{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--cb);color:var(--ct)}
.qk .qi svg{width:22px;height:22px}

/* switches */
.swr{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:6px 0;text-align:left}
.swr .lt b{font-weight:500}
.sw{flex-shrink:0;position:relative;width:52px;height:32px;border-radius:999px;background:var(--bd2);transition:background .2s;margin-right:6px}
.sw i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.swr[aria-checked="true"] .sw{background:var(--ct,var(--gut-t))}
.swr[aria-checked="true"] .sw i{transform:translateX(20px)}
.ptag{font-size:12px;font-weight:700;color:var(--ct)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border:1px solid var(--bd2);border-radius:999px;background:var(--card);font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.chip.idea{background:var(--amb-bg);border-color:transparent;color:var(--amb)}
.chip.idea[aria-pressed="true"]{background:var(--amb);color:var(--card)}

/* bristol + blood */
.bris{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.bris button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:68px;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
.bris b{font-size:20px;font-weight:800}

const dayD=date=>obj(S.get("day:"+date,{}));
function putDay(date,patch){
 const d=Object.assign({},dayD(date),patch);
 Object.keys(d).forEach(k=>{if(d[k]===undefined||d[k]===null||d[k]==="")delete d[k]});
 if(Object.keys(d).length)S.set("day:"+date,d);else S.del("day:"+date);
}
const ticks=date=>obj(S.get("gut:diet:"+date,{}));
const tick=(date,id)=>!!ticks(date)[id];
function setTick(date,id,on){
 const o=Object.assign({},ticks(date));if(on)o[id]=1;else delete o[id];
 if(Object.keys(o).length)S.set("gut:diet:"+date,o);else S.del("gut:diet:"+date);
}
function stools(date){const v=S.get("gut:stools:"+date,[]);return Array.isArray(v)?v.filter(x=>x&&typeof x==="object"):[]}
const bloodOn=date=>stools(date).some(s=>s.blood);
function sleepData(date){
 const v=S.get("sleep:"+date,null);
 if(!v||typeof v!=="object")return {sleep:"",wake:"",score:"",note:""};
 return {sleep:typeof v.sleep==="string"?v.sleep:"",wake:typeof v.wake==="string"?v.wake:"",
         score:v.score!=null?String(v.score):"",note:typeof v.note==="string"?v.note:""};
}
/* bedtime from noon on is the evening before; earlier bedtimes are just after midnight */
function calcSleepDur(bed,wake){
 const b=toMin(bed),w=toMin(wake);
 if(b==null||w==null)return null;
 const diff=w-(b>=720?b-1440:b);
 if(diff<=0||diff>16*60)return null;
 return {diff,hours:Math.floor(diff/60),mins:diff%60};
}
/* the time picker can't tell a PM bedtime from an AM one, so fix the usual slip */
function fixSleepTime(field,v){
 const m=toMin(v);if(m==null)return v;
 const h=Math.floor(m/60);let n=m;
 if(field==="sleep"){if(h>=4&&h<12)n=m+720;else if(h>=12&&h<16)n=m-720}
 else if(field==="wake"&&h>=13)n=m-720;
 return hhmm(n);
}
const fert=date=>obj(S.get("fert:"+date,{}));
const relOn=date=>{const f=fert(date);return !!(f.rel||f.sex||f.nm===false)};

/* iron every other day: "done" | "due" | "off", or null when the course is off. Future days alternate. */
const ironOn=()=>S.get("iron",true)!==false;
function ironDay(date){
 if(!ironOn()||date<IRON_FROM)return null;
 if(tick(date,"n_iron"))return "done";
 const tk=todayKey();
 if(date<=tk)return tick(addDays(date,-1),"n_iron")?"off":"due";
 let d=tk,s=ironDay(tk);
 while(d<date){d=addDays(d,1);s=s==="off"?"due":"off"}
 return s;
}
/* RestoraLAX by the stool, not the clock: due after a hard last stool (Types 1 to 3) or a day with none */
function rlxRule(date){
 const list=stools(addDays(date,-1));
 if(!list.length)return {due:true,why:"No bowel movement logged yesterday"};
 const t=Number(list[list.length-1].type)||4;
 return {due:t<=3,why:"Yesterday's last was Type "+t};
}

function steps(date){
 const w=wakeMin(),out=[],iron=ironDay(date),mv=MOVE[dow(date)],r=rlxRule(date);
 if(iron)out.push({id:"n_iron",m:w+15,p:"calm",off:iron==="off",name:"Iron + vitamin C",
  sub:iron==="off"?"Off day: iron is every other day":"50 mg iron + vitamin C, with water only"});
 out.push({id:"n_move",m:w+25,p:"move",move:true,kind:mv.kind,mins:mv.mins,name:mv.name,sub:mv.sub});
 out.push({id:"n_chia",m:w+75,p:"gut",name:"Chia + glutamine",sub:"1 tbsp soaked chia · 5 g glutamine"});
 out.push({id:"n_rlx",m:w+105,p:"gut",rlx:true,due:r.due,name:r.due?"RestoraLAX: take today":"RestoraLAX: skip today",
  sub:r.due?r.why+", so take one 17 g dose":r.why+", so it isn't needed"});
 out.push({id:"n_bfast",m:540,p:"calm",name:"Breakfast + D3",sub:"4 eggs · 30 g nuts · coffee · D3 2,000 IU"});
 out.push({id:"n_psy",m:720,p:"gut",name:"Metamucil",sub:"With a full glass of water, 20 minutes before food"});
 out.push({id:"n_oats",m:840,p:"calm",name:"Oatmeal + berries",sub:"Plain oats, no added sugar"});
 out.push({id:"n_prune",m:900,p:"gut",name:"Prunes + 30 g nuts",sub:"3 to 4 prunes · walnuts, almonds, hazelnuts"});
 out.push({id:"n_post",m:1020,p:"calm",name:"Whey + creatine",sub:"25 g whey isolate · 5 g creatine"});
 out.push({id:"n_dinner",m:1080,p:"calm",name:"Dinner + stack",sub:"Broth first · cooked tomato in olive oil · kefir · omega-3 ×2, CoQ10, Centrum"});
 out.push({id:"n_walk",m:1110,p:"move",name:"15-minute walk",sub:"Easy pace, right after dinner"});
 out.push({id:"n_pf",m:1120,p:"move",name:"Pelvic floor sets",sub:"Your daily sets, any time today"});
 return out;
}
/* true / false, or null for a step that doesn't count today */
function stepDone(date,st){
 if(st.off)return null;
 if(st.rlx&&!st.due)return true;
 if(st.kind==="rest")return true;
 if(st.p==="move"&&dayD(date).sick)return true;
 return tick(date,st.id);
}
const autoStep=(date,st)=>(st.rlx&&!st.due)||st.kind==="rest"||(st.p==="move"&&!!dayD(date).sick);

function pillars(date){
 const P={};PK.forEach(k=>P[k]={done:0,due:0,items:[]});
 const add=(p,label,done,extra)=>{P[p].due++;if(done)P[p].done++;P[p].items.push(Object.assign({label,done:!!done},extra||{}))};
 steps(date).forEach(st=>{const d=stepDone(date,st);if(d!==null)add(st.p,st.name,d,{id:st.id,auto:autoStep(date,st)})});
 const dd=dayD(date);
 CLOSE.forEach(c=>add(c.p,c.name,!!dd.closed&&dd[c.k]===1,{close:true}));
 add("calm","A fun moment",!!(dd.fun&&String(dd.fun).trim()),{fun:true});
 const s=sleepData(date),dur=calcSleepDur(s.sleep,s.wake);
 add("sleep","Slept 8 hours",!!(dur&&dur.diff>=480),{sleep:true});
 add("sleep","Turmeric milk + kiwi",dd.milk===1,{night:"milk"});
 add("sleep","Screens off after 7 PM",dd.scr===1,{night:"scr"});
 return P;
}
/* days before the redesign: a rough read of what the old app logged */
let liftDates=null,firstStoolCache=null;
function liftSet(){
 if(liftDates)return liftDates;liftDates=new Set();
 S.keys().forEach(k=>{if(k.indexOf("lift:")===0){const v=S.get(k,[]);if(Array.isArray(v))v.forEach(x=>{if(x&&isDate(x.d))liftDates.add(x.d)})}});
 return liftDates;
}
function legacyFr(date){
 const s=sleepData(date),dur=calcSleepDur(s.sleep,s.wake),st=stools(date),tk=Object.keys(ticks(date)).length;
 const junk=!!S.get("gut:junk:"+date,false),lift=liftSet().has(date);
 if(!dur&&!st.length&&!tk&&!junk&&!lift)return null;
 return {gut:st.some(x=>x.blood)?.25:(st.length||tk)?1:.5,sleep:dur?(dur.diff>=480?1:dur.diff>=420?.66:.33):0,
  calm:junk?.33:tk?Math.min(1,tk/8):0,move:lift?1:0};
}
function fracs(date){
 if(date<PLAN_FROM)return legacyFr(date);
 const P=pillars(date),f={};PK.forEach(k=>f[k]=P[k].due?P[k].done/P[k].due:0);return f;
}
function firstStool(){
 if(firstStoolCache!==null)return firstStoolCache||null;
 let f="";S.keys().forEach(k=>{if(k.indexOf("gut:stools:")===0){const d=k.slice(11);if(isDate(d)&&(!f||d<f))f=d}});
 firstStoolCache=f;return f||null;
}
function bleedInfo(){
 const tk=todayKey(),first=firstStool()||tk;
 if(bloodOn(tk)){
  let n=0,c=0;
  for(let i=0;i<30;i++){const d=addDays(tk,-i);if(d<first)break;c++;if(!bloodOn(d))n++}
  return {today:true,n,c};
 }
 let d=addDays(tk,-1),last=null;const stop=addDays(CH_FROM,-120);
 while(d>=stop){if(bloodOn(d)){last=d;break}d=addDays(d,-1)}
 return {today:false,days:last?dayDiff(last,tk):dayDiff(first,tk)+1,last,first};
}
function lastFever(){let d=todayKey();const stop=addDays(CH_FROM,-30);while(d>=stop){if(dayD(d).fever)return d;d=addDays(d,-1)}return null}
function comebackDone(date){const d=dayD(date),cb=obj(d.cb);return !!(d.closed&&cb.water&&cb.plain&&tick(date,"n_prune"))}
function cleanStatus(date){
 if(date<PLAN_FROM)return "na";
 const d=dayD(date),slipped=Array.isArray(d.slips)&&d.slips.length>0;
 if(d.closed&&d.nospicy===1&&d.eighty===1&&d.clean===1&&!slipped)return "y";
 if(slipped&&comebackDone(date))return "cb";

}
const funOn=date=>!!String(dayD(date).fun||"").trim();
/* the last 14 days, oldest first; today counts once it's done */
function rolling(fn){
 const tk=todayKey(),out=[];
 for(let i=13;i>=0;i--){const d=addDays(tk,-i);out.push(d<PLAN_FROM?"na":fn(d))}
 const counted=out.filter(x=>x==="y"||x==="n"||x==="cb");
 return {cells:out,yes:out.filter(x=>x==="y").length,of:counted.length};
}

  h+=nowCard(date);
  if(firstEvening())h+=`<div class="warn"><div><b>First evening with the new app</b><small>The 7 PM screens-off lock starts tomorrow.</small></div></div>`;
  if(!dd.closed&&m>=17*60)h+=`<button type="button" class="cta" data-act="close" data-d="${date}">${I.moon}<span><b>Close the day</b><small>${m<SCREENS_OFF?"Screens off at 7:00 PM, in "+plural(SCREENS_OFF-m,"min"):"Then put the phone down"}</small></span></button>`;
  if(Array.isArray(dd.slips)&&dd.slips.length&&!comebackDone(date))h+=`<button type="button" class="cta soft" data-act="comeback" data-d="${date}">${I.bolt}<span><b>Comeback in progress</b><small>${esc(dd.slips.map(s=>SLIPN[s.k]||"Slip").join(", "))} logged. Finish the comeback.</small></span></button>`;
 }

  <div class="links"><button type="button" class="lnk" data-act="slip" data-d="${date}">Something slipped?</button>${isT?`<button type="button" class="lnk" data-act="fever">Feeling sick?</button>`:""}</div>`;
 return h;

function heroCard(){

function lastNightCard(date,isT){

  ?`<button type="button" class="lnr${ok?" ok":""}" data-act="sleep" data-d="${date}"><span class="ck">${ok?I.check:""}</span><span class="lt"><b>Slept ${dur.hours} h ${pad(dur.mins)} m${ok?"":" · goal is 8 h"}</b><small>${esc(fmtClock(s.sleep))} to ${esc(fmtClock(s.wake))}${s.score!==""?" · score "+esc(s.score):""}</small></span></button>`

function batchGrid(){
 const tk=todayKey(),start=mondayOf(CH_FROM),end=mondayOf(CH_END);
 let h=`<div class="grid"><div class="gr hd" aria-hidden="true"><span></span>${"MTWTFSS".split("").map(x=>`<span>${x}</span>`).join("")}</div>`;
 for(let w=start;w<=end;w=addDays(w,7)){
  h+=`<div class="gr"><span class="gl num">${esc(md(w))}</span>`;
  for(let i=0;i<7;i++){
   const d=addDays(w,i),feb=d>=FEB_A&&d<=FEB_B;
   if(!inCh(d)){h+=`<span class="cell" aria-hidden="true"></span>`;continue}
   if(d>tk){h+=`<span class="cell fut${feb?" feb":""}" aria-hidden="true"></span>`;continue}
   const f=fracs(d);
   const bars=PK.map((k,j)=>{const v=f?f[k]:0;return `<i class="${"gscm"[j]}${v>0?"":" z"}" style="height:${Math.max(2,Math.round(v*22))}px"></i>`}).join("");
   const lab=f?PK.map(k=>PN[k]+" "+Math.round((f[k]||0)*100)+"%").join(", "):"nothing logged";
   h+=`<button type="button" class="cell${feb?" feb":""}${d===tk?" today":""}" data-act="day" data-d="${d}" aria-label="${esc(wdmd(d))}: ${esc(lab)}">${bars}</button>`;
  }
  h+=`</div>`;
 }
 return h+`</div>`;
}

/* move timer */
function stopTimer(silent){timer=null;if(!silent)renderAll()}
function tickTimer(){
 if(!timer)return;
 const el=document.getElementById("tmr"),left=timer.end-Date.now();
 if(el)el.textContent=fmtLeft(left);
 if(left<=0&&!timer.done){timer.done=true;toast("Time's up. Tap Done.");try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}}
}
setInterval(tickTimer,1000);

/* =================== TOAST & UNDO =================== */
let toastT=null,toastUndo=null;
function toast(text,undo){
 const t=$("#toast");if(!t)return;
 toastUndo=undo||null;
 t.innerHTML=`<span>${esc(text)}</span>${undo?`<button type="button" onclick="undoToast()">Undo</button>`:""}`;
 t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(hideToast,undo?6000:2600);
}
function hideToast(){const t=$("#toast");if(t)t.classList.remove("show");toastUndo=null}
function undoToast(){const u=toastUndo;hideToast();if(u){u();toast("Undone")}}
/* remembers the stored value of a few keys, and returns a function that puts them back */
function keep(...keys){
 const prev=keys.map(k=>{let v=null;try{v=localStorage.getItem(K+k)}catch(e){}return [k,v]});
 return ()=>{prev.forEach(([k,v])=>{try{v===null?localStorage.removeItem(K+k):localStorage.setItem(K+k,v)}catch(e){}});resetCaches();renderAll();if(sheet)renderSheet()};
}
function resetCaches(){liftDates=null;firstStoolCache=null}

/* =================== SHEETS =================== */
let sheet=null,sh=null,sheetReturn=null;
function openSheet(kind,state){
 sheet=kind;sh=state||{};sheetReturn=document.activeElement;
 $("#app").inert=true;document.documentElement.classList.add("lock");
 renderSheet("sheet");
}
function renderSheet(focusId){
 const root=$("#sheetRoot");
 if(!sheet){root.innerHTML="";return}
 let el=$("#sheet");
 if(!el){root.innerHTML=`<div class="shade" data-act="x"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT" tabindex="-1"></div>`;el=$("#sheet")}
 const top=el.scrollTop;
 el.innerHTML=`<div class="grab" aria-hidden="true"></div>`+(SHEETS[sheet]?SHEETS[sheet]():"");
 el.scrollTop=top;
 if(focusId){const t=focusId==="sheet"?el:document.getElementById(focusId)||el;try{t.focus({preventScroll:t===el})}catch(e){t.focus()}}
 fitSheet();
}
function closeSheetNow(){
 const back=sheetReturn;
 sheet=null;sh=null;sheetReturn=null;
 $("#sheetRoot").innerHTML="";
 $("#app").inert=false;document.documentElement.classList.remove("lock");
 renderAll();
 if(back&&back.dataset&&back.dataset.act){
  const sig=`[data-act="${back.dataset.act}"]`+["k","id","d","v"].map(f=>back.dataset[f]!=null?`[data-${f}="${back.dataset[f]}"]`:"").join("");
  try{const el=$("#app").querySelector(sig);if(el)el.focus({preventScroll:true})}catch(e){}
 }
}
function closeSheet(){closeSheetNow()}
/* keep the sheet above the iPhone keyboard */
function fitSheet(){
 const el=$("#sheet"),vv=window.visualViewport;if(!el||!vv)return;
 const kb=Math.max(0,Math.round(window.innerHeight-vv.height-vv.offsetTop));
 if(kb>80){el.style.bottom=kb+"px";el.style.maxHeight=Math.round(vv.height-8)+"px";el.style.paddingBottom="14px"}
 else{el.style.bottom="";el.style.maxHeight="";el.style.paddingBottom=""}
}

  const date=s.date,dd=dayD(date),cb=obj(dd.cb),slips=Array.isArray(dd.slips)?dd.slips:[],r=rolling(cleanStatus);
  const item=(k,label,on)=>`<button type="button" id="cb_${k}" class="lnr gut${on?" ok":""}" data-act="cb" data-k="${k}" aria-pressed="${!!on}" style="min-height:52px"><span class="ck" style="${on?"background:var(--gut-t);border-color:var(--gut-t)":""}">${on?I.check:""}</span><span class="lt"><b>${label}</b></span></button>`;
  return `${head("Not a reset.",slips.length?slips.map(x=>(SLIPN[x.k]||"Slip")+" at "+fmtClock(x.t)).join(" · "):"")}
   <p style="font-size:15px;line-height:1.45;color:var(--t2)">The clean days before it still count. The comeback starts with the next thing you eat.</p>
   <p class="sec">Comeback by 7 PM</p><div class="box">${item("water","Big glass of water now",cb.water)}${item("prunes","Prunes at 3:00, as planned",tick(date,"n_prune"))}${item("plain","Plain dinner, stopped at 80%",cb.plain)}
    <div class="lnr${dd.closed?" ok":""}" style="min-height:52px"><span class="ck" style="${dd.closed?"background:var(--gut-t);border-color:var(--gut-t)":""}">${dd.closed?I.check:""}</span><span class="lt"><b>Close the day before 7</b></span></div></div>
   <p class="note">Do these and the day shows as a comeback day, not a miss.</p>
   <div class="roll gut" style="margin-top:12px" role="img" aria-label="${r.yes} clean days of the last ${r.of}">${r.cells.map(c=>`<i class="${c}"></i>`).join("")}</div>
   <p class="note">Clean days: ${r.yes} of the last ${r.of}. It counts 14 days, so one slip never shows as a zero.</p>
   <p class="sec">Next time</p><div class="ifg"><label for="cbIf">If</label><input id="cbIf" class="inp" type="text" maxlength="100" value="${esc(s.ifx)}" data-in="sh" data-k="ifx" placeholder="I'm eating out at lunch">
    <label for="cbThen">Then</label><input id="cbThen" class="inp" type="text" maxlength="100" value="${esc(s.thenx)}" data-in="sh" data-k="thenx" placeholder="I order it mild, no chili"></div>
   <div class="acts"><button type="button" class="btn pri gut" data-act="cbSave">Save the plan</button></div>`},

 fun:()=>`${head("Fun moment",wdmd(todayKey()))}<label class="lb" for="fnText" style="margin-top:4px">What was it?</label>
  <input id="fnText" class="inp" type="text" maxlength="140" value="${esc(sh.text)}" data-in="sh" data-k="text" placeholder="What made you laugh today?">
  <div class="chips" style="margin-top:10px"><button type="button" id="f_tog" class="chip" data-act="funTog" aria-pressed="${!!sh.tog}">Together</button></div>
  <div class="acts"><button type="button" class="btn ink" data-act="funSave">Save</button></div>`,

 fever:()=>`${head("Fever or feeling sick",wdmd(todayKey()))}
  <p style="font-size:15px;line-height:1.45;color:var(--t2)">A fever can set sperm back 2 to 3 months, so it's worth logging. Rest, fluids and sleep come first; call your doctor if it's high or lasts.</p>
  <label class="lb" for="fvT">Temperature (°C, optional)</label><input id="fvT" class="inp num" inputmode="decimal" style="width:150px" value="${esc(sh.temp)}" data-in="sh" data-k="temp" placeholder="38.4">
  <div class="box" style="margin-top:14px">${swRow("fv_sick","sick","",sh.sick,"Sick day: rest today","Move counts as done; no workout","move")}</div>
  <p class="note bad" id="sh_st" role="status"></p>
  <div class="acts">${sh.had?`<button type="button" class="btn del" data-act="feverDel">Clear</button>`:""}<button type="button" class="btn ink" data-act="feverSave">Save</button></div>`,

 meds:()=>{const tk=todayKey(),a=Array.isArray(dayD(tk).meds)?dayD(tk).meds:[];
  return `${head("Before taking a pill")}
  <p style="font-size:15px;line-height:1.45;color:var(--t2)">Is it on your list, or truly needed today? If it's new, ask the pharmacist whether it affects fertility.</p>
  <div class="box tint" style="margin-top:12px"><p class="kick" style="color:var(--t2)">ON YOUR LIST</p><p class="note" style="margin-top:4px">Iron + vitamin C (every other day) · D3 · omega-3 · CoQ10 · Centrum · creatine · Metamucil · RestoraLAX when due</p></div>
  <label class="lb" for="medName">Log something you took</label><div class="addr"><input id="medName" class="inp" type="text" maxlength="60" value="${esc(sh.name)}" data-in="sh" data-k="name" placeholder="e.g. acetaminophen 500 mg"><button type="button" class="btn ink" style="flex:none" data-act="medAdd">Log</button></div>
  ${a.length?`<div class="box" style="margin-top:12px">${a.map((x,i)=>`<div class="fr"><span class="tb" style="cursor:default">${esc(fmtClock(x.t))} · ${esc(x.n)}</span><button type="button" class="xb" data-act="medDel" data-v="${i}" aria-label="Delete ${esc(x.n)}">×</button></div>`).join("")}</div>`:""}`},

 sleep:()=>{const s=sh,dur=calcSleepDur(s.sleep,s.wake);
  return `${head("Last night","Saved to "+wdmd(s.date))}
  <button type="button" class="rowbtn" data-act="slPlan" style="margin-top:4px">As planned: ${esc(fmtM(outMin()))} to ${esc(fmtM(wakeMin()))}</button>
  <div class="tin"><div><label class="lb" for="slB">Bedtime</label><input id="slB" class="inp num" type="time" value="${esc(s.sleep)}" data-in="sh" data-k="sleep"></div>
   <div><label class="lb" for="slW">Wake-up</label><input id="slW" class="inp num" type="time" value="${esc(s.wake)}" data-in="sh" data-k="wake"></div></div>
  <label class="lb" for="slS">Charge 6 sleep score (optional)</label><input id="slS" class="inp num" inputmode="numeric" style="width:150px" value="${esc(s.score)}" data-in="sh" data-k="score" placeholder="84">
  <label class="lb" for="slN">Note (optional)</label><input id="slN" class="inp" type="text" maxlength="120" value="${esc(s.note)}" data-in="sh" data-k="note" placeholder="Wake-ups, room temperature…">
  ${dur?`<p class="note">${dur.hours} h ${pad(dur.mins)} m${dur.diff>=480?": goal met":": goal is 8 h"}</p>`:""}
  <p class="note bad" id="sh_st" role="status"></p><div class="acts"><button type="button" id="sl_save" class="btn pri sleep" data-act="slSave">Save</button></div>`},

 pillar:()=>{const P=pillars(sh.date),p=P[sh.k],isT=sh.date===todayKey();
  const rows=p.items.map(it=>{
   if(it.id&&!it.auto)return `<button type="button" class="tl ${sh.k}${it.done?" on":""}" data-act="tick" data-id="${it.id}" data-d="${sh.date}" aria-pressed="${it.done}"><span class="ck" aria-hidden="true">${it.done?I.check:""}</span><span class="tt"><b>${esc(it.label)}</b></span></button>`;
   const hint=it.close?"From Close the day":it.fun?"Close the day or the Fun tab":it.sleep||it.night?"From the Last night card":"Automatic today";
   return `<div class="tl ${sh.k}${it.done?" on":""}"><span class="ck" aria-hidden="true">${it.done?I.check:""}</span><span class="tt"><b>${esc(it.label)}</b><small>${hint}</small></span></div>`;
  }).join("");
  return `${head(PN[sh.k]+" · "+p.done+" of "+p.due,(isT?"Today":wdmd(sh.date))+" · "+PGOAL[sh.k])}<div class="box">${rows}</div>`},

 move:()=>{const st=steps(sh.date).find(x=>x.move);return `${head(st.name,wdmd(sh.date))}<div class="box tint">${MOVE_HOW[st.kind].map(x=>`<p class="rule move" style="--c:var(--move)">${esc(x)}</p>`).join("")}</div>`}
};

/* bowel movements, in the same format as before */
function openStool(date,id,blood){
 if(date>todayKey())return;
 const e=id!=null?stools(date).find(x=>String(x.id)===String(id)):null;
 openSheet("bm",e?{date,id:e.id,time:typeof e.time==="string"?e.time:"",type:String(BRISTOL[e.type]?e.type:4),blood:!!e.blood,mucus:!!e.mucus,note:typeof e.note==="string"?e.note:"",ph:!!e.ph,five:!!e.five,nostr:!!e.nostr}
  :{date,id:null,time:nowHM(),type:"4",blood:!!blood,mucus:false,note:"",ph:true,five:true,nostr:true});
}
function saveStool(){
 const s=sh;if(!s||s.date>todayKey())return;
 const list=stools(s.date);let id=s.id;
 if(id==null){id=Date.now();while(list.some(x=>String(x.id)===String(id)))id++}
 const entry={id,time:s.time||nowHM(),type:Number(s.type)||4,blood:!!s.blood,mucus:!!s.mucus,note:String(s.note||"").trim().slice(0,100),ph:s.ph?1:0,five:s.five?1:0,nostr:s.nostr?1:0};
 const i=list.findIndex(x=>String(x.id)===String(id));
 if(i>=0)list[i]=entry;else list.push(entry);
 list.sort((a,b)=>String(a.time||"").localeCompare(String(b.time||"")));
 const undo=keep("gut:stools:"+s.date);
 if(!S.set("gut:stools:"+s.date,list)){const st=$("#sh_st");if(st)st.textContent="Couldn't save in this browser. Try again.";return}
 resetCaches();closeSheetNow();
 toast(entry.blood?"Logged. Honest logs are how this gets fixed.":i>=0?"Updated":"Logged",undo);
}
function delStool(){
 const s=sh;if(!s||s.id==null)return;
 const undo=keep("gut:stools:"+s.date),list=stools(s.date).filter(x=>String(x.id)!==String(s.id));
 if(list.length)S.set("gut:stools:"+s.date,list);else S.del("gut:stools:"+s.date);
 resetCaches();closeSheetNow();toast("Entry deleted",undo);
}
function openClose(date){
 if(date>todayKey())return;
 const dd=dayD(date),slips=Array.isArray(dd.slips)?dd.slips:[],v={};
 CLOSE.forEach(c=>{const slipped=slips.some(x=>{const r=SLIPS.find(y=>y[0]===x.k);return r&&r[2]===c.k});
  v[c.k]=dd.closed?dd[c.k]===1:(dd[c.k]===0||slipped)?false:true});
 openSheet("close",{date,v,fun:String(dd.fun||""),tog:!!dd.tog});
}
function saveClose(){
 const s=sh,patch={fun:s.fun.trim().slice(0,140),tog:s.tog?1:null,closed:nowHM()};
 CLOSE.forEach(c=>patch[c.k]=s.v[c.k]?1:0);
 const undo=keep("day:"+s.date),isT=s.date===todayKey();putDay(s.date,patch);
 closeSheetNow();
 const after=pillars(s.date),full=PK.filter(k=>after[k].due&&after[k].done>=after[k].due).length;
 toast(isT?(nowMin()<SCREENS_OFF?`Day closed: ${full} of 4 pillars full. Screens off at 7.`:`Day closed: ${full} of 4 pillars full.`):"Day closed",undo);
}
function openSleep(date){
 if(date>todayKey())return;
 const s=sleepData(date);openSheet("sleep",{date,sleep:s.sleep,wake:s.wake,score:s.score,note:s.note});
}
function saveSleep(){
 const s=sh,st=$("#sh_st");
 const bed=s.sleep?fixSleepTime("sleep",s.sleep):"",wake=s.wake?fixSleepTime("wake",s.wake):"";
 if(bed&&wake&&!calcSleepDur(bed,wake)){if(st)st.textContent="Those times don't add up to a night. Bedtime is the evening before; wake-up is the morning.";return}
 const sc=String(s.score||"").trim();
 if(sc&&!(Number(sc)>=0&&Number(sc)<=100)){if(st)st.textContent="Sleep score is 0 to 100.";return}
 const d={sleep:bed,wake,score:sc?Number(sc):"",note:String(s.note||"").trim().slice(0,120)};
 const undo=keep("sleep:"+s.date);
 if(!d.sleep&&!d.wake&&d.score===""&&!d.note)S.del("sleep:"+s.date);else S.set("sleep:"+s.date,d);
 closeSheetNow();
 const dur=calcSleepDur(d.sleep,d.wake);
 toast(dur?`${dur.hours} h ${pad(dur.mins)} m${dur.diff>=480?" · goal met":""}`:"Saved",undo);
}

/* =================== BACKUP =================== */
function allData(){const d={};S.keys().forEach(k=>{try{d[k]=JSON.parse(localStorage.getItem(K+k))}catch(e){}});return d}
function downloadFile(text,name){
 const b=new Blob([text],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function markBackup(tk){S.set("lastexport",tk);if(!sheet)renderAll()}
/* on iPhone this opens the share sheet, so "Save to Files", AirDrop or Messages all work */
async function exportData(){
 const tk=todayKey(),d=allData();d.lastexport=tk;
 const name="health-log-"+tk+".json",json=JSON.stringify(d,null,1);
 let file=null;try{file=new File([json],name,{type:"application/json"})}catch(e){}
 let canFile=false;try{canFile=!!(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]}))}catch(e){}
 if(canFile){
  try{await navigator.share({files:[file],title:"Four Pillars backup"});markBackup(tk);toast("Backup saved")}
  catch(e){if(!e||e.name!=="AbortError"){downloadFile(json,name);markBackup(tk)}}
  return;
 }
 downloadFile(json,name);markBackup(tk);toast("Backup downloaded");
}
const KNOWN=/^(lift:|mode:|sleep:|gut:|fert:|wchk:|jr:|day:|wrev:|fview$|wview$|lastexport$|wake$|iron$|funlist$|funbig$|tests$|setup$|ifthen$|planFrom$)/;
function importData(inp){
 const f=inp.files&&inp.files[0];inp.value="";if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  let d;try{d=JSON.parse(r.result)}catch(e){toast("That file isn't a backup from this app.");return}
  if(!d||typeof d!=="object"||Array.isArray(d)){toast("That file isn't a backup from this app.");return}
  const keys=Object.keys(d).filter(k=>k&&k.length<80&&KNOWN.test(k));
  if(!keys.length){toast("That file has no log entries.");return}
  const when=isDate(d.lastexport)?" from "+wdmd(d.lastexport):"";
  confirmAsk({title:"Restore this backup?",ok:"Replace",danger:true,run:()=>doImport(d,keys),
   text:`This replaces everything in the app with the backup${when} (${keys.length} entries). You can undo right after.`});
 };
 r.onerror=()=>toast("Couldn't read that file.");
 r.readAsText(f);
}
function snapshotAll(){
 const snap={};S.keys().forEach(k=>{try{snap[k]=localStorage.getItem(K+k)}catch(e){}});
 return ()=>{S.keys().forEach(k=>{if(!(k in snap))S.del(k)});
  Object.keys(snap).forEach(k=>{try{localStorage.setItem(K+k,snap[k])}catch(e){}});resetCaches();renderAll()};
}
function doImport(d,keys){
 const undo=snapshotAll();
 S.keys().forEach(k=>S.del(k));
 for(const k of keys){if(!S.set(k,d[k])){undo();toast("Couldn't restore: this browser is out of space. Nothing changed.");return}}
 if(!isDate(S.get("planFrom",null)))S.set("planFrom",PLAN_FROM);
 resetCaches();tab="today";sel=null;renderAll();toast("Backup restored",undo);
}

/* =================== START =================== */
/* home-screen apps stay suspended overnight: jump to the new day, and lock or unlock at 7 PM and at wake-up */
let lastNight=null;
function checkDay(){
 const tk=todayKey(),n=nightLocked();
 if(tk!==lastTk){lastTk=tk;sel=null;snoozed.clear();if(!sheet)renderAll();lastNight=n;return}
 if(n!==lastNight){lastNight=n;if(!sheet)renderAll();return}
 const ae=document.activeElement,typing=ae&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA");
 if(!sheet&&!typing&&tab==="today")renderAll();
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkDay()});
window.addEventListener("pageshow",checkDay);
window.addEventListener("focus",checkDay);
setInterval(()=>{if(!document.hidden)checkDay()},30000);
if(window.visualViewport){visualViewport.addEventListener("resize",fitSheet);visualViewport.addEventListener("scroll",fitSheet)}
/* ask Safari to keep this app's storage (iPhone and iPad only; elsewhere it can trigger a prompt) */
try{if(navigator.standalone!==undefined&&navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
lastNight=nightLocked();
renderAll();
</script>
