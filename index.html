<style>
:root{
  color-scheme:light dark;
  --bg:#faf9f7;--card:#fff;--bd:#e7e4de;--bd2:#d5d1c8;
  --text:#1c1b19;--t2:#67645d;--t3:#8c897f;
  --acc:#2f6f5e;--acc-bg:#e8f2ee;--on-acc:#fff;--today:#f1f6f3;
  --warn:#7d5615;--warn-bg:#fbf2e1;--alert:#a14545;--alert-bg:#f9ecec;--loose:#6a4cb5;--loose-bg:#f1edfb;
  --shade:rgba(28,27,25,.42);--toast:#1c1b19;--toast-t:#f4f2ee;--toast-a:#8fd3bd;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --topH:56px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141413;--card:#1d1d1b;--bd:#2d2c29;--bd2:#3e3d38;--text:#f0eee9;--t2:#a6a39b;--t3:#85827a;
        --acc:#6cbfa6;--acc-bg:#1d2b26;--on-acc:#0f201b;--today:#17211d;
        --warn:#dcae62;--warn-bg:#2b2519;--alert:#e39494;--alert-bg:#301e1e;--loose:#b9a3f0;--loose-bg:#262036;
        --shade:rgba(0,0,0,.6);--toast:#f0eee9;--toast-t:#1c1b19;--toast-a:#2f6f5e}
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;background:var(--bg)}
html.lock,html.lock body{overflow:hidden}
body{background:var(--bg);color:var(--text);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;
     padding-bottom:calc(env(safe-area-inset-bottom) + 80px)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:640px;margin:0 auto;padding:0 max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left))}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;background:var(--bg);
     height:calc(env(safe-area-inset-top) + var(--topH));padding-top:env(safe-area-inset-top)}
.top h1{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.top p{font-size:13px;color:var(--t2);line-height:1.3}
.nav{margin-left:auto;display:flex;gap:6px}
.nb{height:40px;min-width:40px;padding:0 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--t2);font-size:19px;line-height:1}
.nb.txt{font-size:14px;font-weight:600;color:var(--acc)}
.nb:disabled{opacity:.35}

/* page */
.pg{display:flex;flex-direction:column;gap:12px}
.goal{font-size:13.5px;color:var(--t2);line-height:1.4;padding:0 2px}
.dh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:6px 2px 0}
.dh h2{font-size:19px;font-weight:700;letter-spacing:-.015em}
.dh h3{font-size:15px;font-weight:600}
.dh span{font-size:13.5px;color:var(--t2);text-align:right}
.note{font-size:13px;color:var(--t2);line-height:1.4;padding:0 2px}
.list .note{padding:10px 14px}
.hint{font-size:13px;color:var(--t2);line-height:1.4}

/* day strip */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;min-width:0;border:1px solid var(--bd);background:var(--card);border-radius:12px;
    padding:6px 0;font-size:12px;color:var(--t2);line-height:1.25}
.wd b{font-size:17px;font-weight:600;color:var(--text)}
.wd.fu{border-style:dashed;background:transparent}
.wd.td>span,.wd.td b{color:var(--acc)}
.wd[aria-pressed="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.bar{display:block;width:62%;height:4px;border-radius:2px;background:var(--bd);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.mk{display:block;width:8px;height:8px;border-radius:50%;margin-top:4px;border:1.5px solid transparent}
.mk.done{background:var(--acc);border-color:var(--acc)}
.mk.due{border-color:var(--acc);border-style:dashed}
.mk.bl{background:var(--alert);border-color:var(--alert)}

/* cards and lists */
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px}
.list{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.list>*+*{border-top:1px solid var(--bd)}
.list>.gh+*{border-top:0}
.gh{font-size:13px;font-weight:600;color:var(--t2);padding:12px 14px 2px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 14px;text-align:left;background:none;border:0;color:inherit}
button.row:active{background:var(--bg)}
.row:disabled{opacity:.6}
.rt{flex:1;min-width:0}
.nm{display:block;font-size:16px;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.sb{display:block;font-size:13.5px;color:var(--t2);line-height:1.35;margin-top:1px;overflow-wrap:anywhere}
.tm{display:block;font-size:12.5px;font-weight:600;color:var(--acc);line-height:1.4;margin-bottom:1px}
.bx{flex-shrink:0;width:28px;height:28px;border-radius:50%;border:1.6px solid var(--bd2);display:grid;place-items:center;
    font-size:14px;font-weight:700;color:transparent}
.row.on .bx{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.row.on .nm{color:var(--t2)}
.row.neg.on .bx{background:var(--alert);border-color:var(--alert);color:var(--card)}
.row.neg.on .nm{color:var(--alert)}
.chev{flex-shrink:0;font-size:24px;line-height:1;color:var(--t3)}
.pill{display:inline-block;margin-left:4px;padding:0 7px;border-radius:99px;background:var(--acc-bg);color:var(--acc);
      font-size:11.5px;font-weight:600;line-height:1.6;vertical-align:1px}
.pill.mute{background:var(--bg);color:var(--t2)}
.qrow{display:flex;align-items:stretch}
.qrow .row{flex:1}
.ed{width:58px;flex-shrink:0;border:0;border-left:1px solid var(--bd);background:none;color:var(--acc);font-size:14px;font-weight:600}
.ed:disabled{color:var(--t3)}

/* diet steps */
.stepr{display:flex;align-items:stretch}
.stepr .row{flex:1;padding-right:4px}
.why{width:48px;flex-shrink:0;border:0;background:none;color:var(--t3);display:grid;place-items:center}
.why span{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;
          font:italic 700 13px/1 Georgia,"Times New Roman",serif}
.why[aria-expanded="true"]{color:var(--acc)}
.whyp{margin:0 14px 12px 54px;padding:8px 10px;border-radius:8px;background:var(--bg);font-size:13.5px;color:var(--t2);line-height:1.45}
.step.next{box-shadow:inset 3px 0 0 var(--acc)}
.step.skip .nm,.step.off .nm{color:var(--t2)}
.step.skip .bx,.step.off .bx{border-style:dashed}
.step.off .row{opacity:.75}

/* switch row */
.swrow{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 14px;text-align:left;
       background:var(--card);border:1px solid var(--bd);border-radius:14px}
.swrow:disabled{opacity:.55}
.tgl{flex-shrink:0;position:relative;width:51px;height:31px;border-radius:16px;background:var(--bd2);transition:background .2s}
.tgl i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.swrow[aria-checked="true"] .tgl{background:var(--acc)}
.swrow[aria-checked="true"] .tgl i{transform:translateX(20px)}

/* bowel movements */
.bmh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.bmh h3{font-size:16px;font-weight:600}
.bmh span{font-size:13.5px;color:var(--t2)}
.bmrow{display:flex;flex-wrap:wrap;gap:8px}
.bmc{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:1px solid transparent;border-radius:11px;
     font-size:14px;font-weight:500;background:var(--bg)}
.bmc b{font-weight:700}
.bmc.opt{background:var(--acc-bg);color:var(--acc)}
.bmc.constip{background:var(--warn-bg);color:var(--warn)}
.bmc.loose{background:var(--loose-bg);color:var(--loose)}
.bmc.alert{background:var(--alert-bg);color:var(--alert)}
.bmc .fl{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--alert);color:var(--card);font-size:12px;font-weight:700}
.bmc.add{border:1.5px dashed var(--acc);background:transparent;color:var(--acc);font-weight:600;padding:0 16px}

/* forms */
.fld{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:6px 0}
.fld+.fld,.fld+.field{border-top:1px solid var(--bd)}
.fld>label{font-size:16px;font-weight:500;line-height:1.3}
.fld>label small{display:block;font-size:12.5px;font-weight:400;color:var(--t2)}
.fld .inp{width:140px;flex-shrink:0;text-align:right}
.tbox{position:relative;display:block;flex-shrink:0}
/* iPhone shows an empty time field as a blank box, so label it (iOS only; other browsers draw their own --:--) */
@supports (-webkit-touch-callout:none){
  .tbox[data-empty]::after{content:"Set";position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:16px;pointer-events:none}
}
.inp{display:block;width:100%;min-width:0;min-height:44px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;
     padding:8px 12px;font-size:16px;-webkit-appearance:none;appearance:none}
.inp::-webkit-date-and-time-value{text-align:inherit}
.inp:disabled{opacity:.55}
.inp:focus,.ta:focus{outline:2px solid var(--acc);outline-offset:1px}
.tin{display:flex;gap:6px;flex-shrink:0}
.fld .tin .inp{width:118px}
.nowb{min-height:44px;padding:0 12px;border:1px solid var(--bd2);border-radius:10px;background:var(--card);font-size:14px;font-weight:600;color:var(--acc)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-size:14px;font-weight:600;color:var(--t2)}
.card .field{padding-top:10px}
.ta{width:100%;min-height:84px;resize:vertical;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font-size:16px;line-height:1.45}
.pg>.field .ta{background:var(--card)}
.dur{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:var(--acc-bg);
     color:var(--acc);font-size:14px;font-weight:600}
.dur b{display:block;font-size:22px;font-weight:700;letter-spacing:-.01em}
.dur small{display:block;font-size:12.5px;font-weight:500}
.dur.short{background:var(--warn-bg);color:var(--warn)}
.bdg{display:inline-block;margin-left:6px;padding:0 7px;border-radius:6px;font-size:12px;font-weight:600;line-height:1.6;vertical-align:1px}
.bdg.high{background:var(--acc-bg);color:var(--acc)}
.bdg.mid{background:var(--warn-bg);color:var(--warn)}
.bdg.low{background:var(--alert-bg);color:var(--alert)}
.up{padding:10px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13.5px;line-height:1.4}
.st{font-size:13.5px;color:var(--acc);line-height:1.4}
.st.err{color:var(--alert)}
.st:empty{display:none}
.card .st{padding-top:8px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{border:1px solid var(--bd);border-radius:12px;background:var(--card);padding:10px 12px;min-width:0}
.stat b{display:block;font-size:20px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.stat b small{font-size:13px;font-weight:500;color:var(--t2)}
.stat b.met{color:var(--acc)}
.stat b.bad{color:var(--alert)}
.stat span{display:block;font-size:12.5px;color:var(--t2);line-height:1.3;margin-top:2px}

/* sleep week */
.sltab{border:1px solid var(--bd);border-radius:14px;background:var(--card);overflow:hidden;font-size:13px}
.sltab .r{display:grid;grid-template-columns:78px repeat(4,minmax(0,1fr));align-items:center}
.sltab .r+.r{border-top:1px solid var(--bd)}
.sltab .r>div{padding:8px 3px;min-width:0;white-space:nowrap}
.sltab .r>div:first-child{padding-left:10px;padding-right:6px}
.sltab .hd{font-size:12.5px;font-weight:600;color:var(--t2);background:var(--bg)}
@media (max-width:359px){.sltab{overflow-x:auto}.sltab .r{min-width:340px}}
.sltab .r.today{background:var(--today)}
.sltab .r.sel{box-shadow:inset 3px 0 0 var(--acc)}
.sltab .dc b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap}
.sltab .dc span{display:block;font-size:12px;color:var(--t2)}
.sltab b{font-weight:600}
.sltab b.met{color:var(--acc)}

/* workout week matrix: days down, categories across; fixed tracks keep every row's columns lined up */
.mx{--mxc:46px 64px 64px minmax(0,1fr) minmax(0,1fr);border:1px solid var(--bd);border-radius:14px;background:var(--card);overflow:clip}
.mx .r{display:grid;grid-template-columns:var(--mxc)}
.mx .r+.r{border-top:1px solid var(--bd)}
.mx .r>*{min-width:0;padding:5px 3px}
.mx .r>*+*{border-left:1px solid var(--bd)}
.mx .hd{position:sticky;top:calc(env(safe-area-inset-top) + var(--topH));z-index:10;background:var(--card);box-shadow:0 1px 0 var(--bd2)}
.mx .hd+.r{border-top:0}
.mx .hd>*{display:flex;flex-direction:column;justify-content:flex-end;padding:8px 5px 7px;font-size:12px;font-weight:600;line-height:1.2;color:var(--t2)}
.mx .hd small{font-size:11px;font-weight:400}
.mx .r.today{background:var(--today)}
.mx .r>.rh{padding:0}
.dcb{display:flex;flex-direction:column;align-items:flex-start;width:100%;height:100%;padding:7px 2px 7px 7px;border:0;background:none;
     text-align:left;font-size:12.5px;line-height:1.25;color:var(--t2)}
.dcb b{font-size:14px;font-weight:650;color:var(--text)}
.dcb small{margin-top:3px;font-size:11px;line-height:1.2}
.mx .r.today .dcb b,.mx .r.today .dcb span{color:var(--acc)}
.cell{display:flex;flex-direction:column;gap:4px}
.ch{display:block;width:100%;min-height:44px;padding:5px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);
    text-align:left;font-size:12.5px;line-height:1.25;color:var(--text)}
.ch:active{border-color:var(--bd2)}
.ch .n{display:block;font-weight:500;overflow-wrap:break-word}
.ch .s{display:block;margin-top:1px;font-size:11.5px;color:var(--t2);overflow-wrap:break-word}
.ch.done{background:var(--acc-bg);border-color:var(--acc);color:var(--acc)}
.ch.done .s{color:var(--acc)}
.mx .r.fu .ch{background:transparent;border-style:dashed}
.mx .em{padding:8px 6px;font-size:12px;color:var(--t3)}
.mx .rest.span3{grid-column:span 3}
.mx .rest{display:flex;align-items:center;padding:6px 10px;font-size:12.5px;line-height:1.35;color:var(--t2)}
/* very narrow screens: scroll sideways instead of squeezing (a sticky header can't work inside a scroller) */
@media (max-width:359px){.mx{overflow-x:auto}.mx .r{min-width:340px}.mx .hd{position:static}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

/* segmented control */
.seg{display:flex;gap:2px;padding:2px;border-radius:10px;background:var(--bd)}
.seg button{flex:1;min-height:36px;border:0;border-radius:8px;background:transparent;font-size:14px;font-weight:500;color:var(--t2)}

function phaseLine(w){
 if(w>16)return "16-week block done. Keep the daily pelvic floor sets going; full strength can take 5–6 months.";

 if(w===1)return h+"Baseline & learn. This week: book a semen analysis and a body scan. Keep the pelvic floor sets gentle while you learn the squeeze.";
 if(w<=4)return h+"Baseline & learn. Learn the squeeze lying or sitting, and build the Thursday intervals toward 4 × 4.";
 if(w<=7)return h+"Build. Stronger pelvic floor holds, sitting or standing. Thursday intervals reach 4 × 4.";

/* =================== WORKOUT LOGS =================== */
function logs(id){const v=S.get("lift:"+id,[]);return Array.isArray(v)?v:[]}
function entryOn(id,date){return logs(id).find(x=>x.d===date)||null}
function logsBefore(id,date){return logs(id).filter(x=>x.d<date).sort((a,b)=>a.d.localeCompare(b.d))}
function lb(v,unit){const n=Number(v);if(!isFinite(n))return null;return unit&&unit!=="lb"?Math.round(n*2.2046226218*100)/100:n}
function norm(e){
 if(!e)return null;
 if(!Array.isArray(e.sets))return {legacy:true,mode:"reps",sets:[{reps:null,t:null,w:lb(e.w,e.unit)}]};
 return {mode:e.mode==="time"?"time":"reps",sets:e.sets.map(s=>({
  reps:s.reps==null?null:Number(s.reps),t:s.t==null?null:Number(s.t),
  w:s.w==null||s.w===""?null:lb(s.w,e.unit)}))};
}
const unitOf=id=>EX[id].u||"sec";
function modeOf(id){const m=S.get("mode:"+id,null);return m==="time"||m==="reps"?m:EX[id].m}
const nf=n=>String(Math.round(n*100)/100);
const hasW=w=>w!=null&&w!==0;
function wtxt(w,id){const ex=EX[id];return ex.wf?ex.wf(nf(w)):nf(w)+" lb"}
function fmtT(t){t=Math.round(t);if(t<60)return t+" s";if(t%60===0)return t/60+" min";return Math.floor(t/60)+":"+pad(t%60)+" min"}
function summary(e,id){
 const n=norm(e);if(!n)return "";
 if(n.legacy)return (hasW(n.sets[0].w)?wtxt(n.sets[0].w,id)+", ":"")+"reps not recorded";
 const main=s=>n.mode==="time"?fmtT(s.t||0):String(s.reps);
 const ws=n.sets.map(s=>hasW(s.w)?s.w:null),same=ws.every(w=>w===ws[0]);
 if(same){const base=n.sets.map(main).join(", ")+(n.mode==="reps"?" reps":"");return ws[0]!=null?base+" @ "+wtxt(ws[0],id):base}
 return n.sets.map(s=>main(s)+(n.mode==="reps"?" reps":"")+(hasW(s.w)?" @ "+wtxt(s.w,id):"")).join(", ");
}
function shortSum(e){
 const n=norm(e);if(!n)return "";if(n.legacy)return "logged";
 const k=n.sets.length;
 if(n.mode==="time")return k===1?fmtT(n.sets[0].t||0):k+" sets";
 if(n.sets.every(s=>!hasW(s.w)))return n.sets.reduce((a,s)=>a+(s.reps||0),0)+" reps";
 return k===1?n.sets[0].reps+" reps":k+" sets";
}
function topped(id,date){
 const top=EX[id].top;if(!top)return false;
 const l=logsBefore(id,date).map(norm).filter(n=>n&&!n.legacy&&n.mode==="reps"&&n.sets.length);
 return l.length>=2&&l.slice(-2).every(n=>n.sets.every(s=>s.reps>=top));
}
function writeLog(id,date,entry){
 const list=logs(id).filter(x=>x.d!==date);
 list.push(entry);list.sort((a,b)=>a.d.localeCompare(b.d));
 return S.set("lift:"+id,list);
}
function clearLog(id,date){
 delete drafts[draftKey(id,date)];
 const list=logs(id).filter(x=>x.d!==date);
 return list.length?S.set("lift:"+id,list):S.del("lift:"+id);
}
function targetLog(inst,id){
 const t=inst.t||"",mode=modeOf(id);
 if(mode==="time"){
  let m=t.match(/(\d+(?:[.,]\d+)?)\s*min/i);
  if(m)return {mode:"time",sets:[{t:Math.round(parseFloat(m[1].replace(",","."))*60),w:null}]};
  m=t.match(/(\d+)\s*s\b/i);
  if(m)return {mode:"time",sets:[{t:+m[1],w:null}]};
  return {mode:"time",sets:[{t:300,w:null}]};
 }
 const m=t.match(/(\d+)/);
 return {mode:"reps",sets:[{reps:m?+m[1]:1,w:null}]};
}
function daySeq(date){
 const dk=dkOf(date),p=dayPlan(date),seq=[];
 (inBlock(date)?NEW_ORDER:ORDER).forEach(([c,name])=>{const gname=(p.gn&&p.gn[c])||name;
  (p[c]||[]).forEach((inst,i)=>seq.push({dk,col:c,i,inst,group:gname}))});
 return seq;
}
const pfDone=date=>PF_SETS.filter(([id])=>entryOn(id,date)).length;
function weekNumbers(){
 const ds=DAYS.map(dateOf),inWk=e=>ds.includes(e.d);
 const reps=n=>n&&!n.legacy&&n.mode==="reps"?n.sets.reduce((a,s)=>a+(s.reps||0),0):0;
 let z2=0,pu=0,hs=0,pl=0,st=0;
 logs("zone2").filter(inWk).forEach(e=>{const n=norm(e);if(n&&n.mode==="time")n.sets.forEach(s=>z2+=s.t||0)});
 const vo2=logs("sled").filter(inWk).length;
 logs("pushups").filter(inWk).forEach(e=>pu+=reps(norm(e)));
 logs("hindu").filter(inWk).forEach(e=>hs+=reps(norm(e)));
 logs("pullups").filter(inWk).forEach(e=>pl+=reps(norm(e)));
 DAYS.forEach((dk,i)=>{const list=dayPlan(ds[i]).st||[];if(list.length&&list.every(x=>entryOn(x.id,ds[i])))st++});
 const pf=ds.reduce((a,d)=>a+pfDone(d),0),hang=ds.filter(d=>entryOn("hang",d)).length;
 return {z2:Math.round(z2/60),vo2,pu,hs,pl,st,pf,hang};
}

/* drafts keep half-typed sets while the log sheet is open */
const drafts={};
const draftKey=(id,date)=>date+"|"+id;
function tIn(t,unit){t=Math.round(t);return unit==="min"?String(Math.round(t/60*100)/100):String(t)}
function parseT(v,unit){
 v=String(v).trim().toLowerCase();if(!v)return null;
 let m=v.match(/^(\d+):([0-5]?\d)$/);if(m)return (+m[1])*60+(+m[2]);
 m=v.match(/^(\d+(?:[.,]\d+)?)\s*(s|sec|m|min)?$/);if(!m)return NaN;
 const x=parseFloat(m[1].replace(",",".")),u=m[2]?(m[2][0]==="s"?"sec":"min"):unit;
 return Math.round(u==="min"?x*60:x);
}
function toDraft(n,id){
 if(n.legacy)return {mode:"reps",sets:[{a:"",w:hasW(n.sets[0].w)?nf(n.sets[0].w):""}]};
 return {mode:n.mode,sets:n.sets.map(s=>({a:n.mode==="time"?tIn(s.t||0,unitOf(id)):String(s.reps==null?"":s.reps),w:s.w==null?"":nf(s.w)}))};
}
function draft(){
 const {id,date,inst}=cur,k=draftKey(id,date);
 if(!drafts[k]){const n=norm(entryOn(id,date));
  drafts[k]=n?toDraft(n,id):{mode:modeOf(id),sets:Array.from({length:Math.max(1,inst.s||1)},()=>({a:"",w:""}))}}
 return drafts[k];
}
function ph(i,f){
 const {id,date}=cur,dr=draft(),l=logsBefore(id,date),n=norm(l[l.length-1]),unit=unitOf(id);
 if(n&&!n.legacy&&n.mode===dr.mode&&n.sets.length){
  const s=n.sets[Math.min(i,n.sets.length-1)];
  if(f==="a")return dr.mode==="time"?tIn(s.t||0,unit):String(s.reps);
  if(hasW(s.w))return nf(s.w);
 }
 return f==="a"?(dr.mode==="time"?unit:"reps"):"–";
}
function lastNorm(){
 const l=logsBefore(cur.id,cur.date),n=norm(l[l.length-1]);
 if(!n||n.legacy||!n.sets.length)return null;
 if(n.mode==="time"&&n.sets.every(s=>!s.t))return null;
 if(n.mode==="reps"&&n.sets.every(s=>!s.reps))return null;
 return n;
}
function showLoad(id,dr){return !NO_LOAD.has(id)||dr.sets.some(s=>String(s.w).trim()!=="")}
function blankDraft(dr){return dr.sets.every(s=>!String(s.a).trim()&&!String(s.w).trim())}

const stat=(label,n,g,of,cls)=>`<div class="stat${cls?" "+cls:""}"><b class="num${g>0&&n>=g?" met":""}">${n}${g==null?(of?`<small> ${of}</small>`:""):`<small> ${of||"/"} ${g}</small>`}</b><span>${label}</span></div>`;
const badStat=(label,n)=>`<div class="stat"><b class="num ${n>0?"bad":"met"}">${n}</b><span>${label}</span></div>`;
const blankStat=label=>`<div class="stat"><b class="num">–</b><span>${label}</span></div>`;

function ensureSel(){
 const tk=todayKey(),ds=DAYS.map(dateOf);
 if(tab==="fert"&&fertView==="month"){const mr=fertRange();if(!sel||!mr.includes(sel))sel=mr.includes(tk)?tk:mr[0];return ds}
 if(!sel||!ds.includes(sel))sel=ds.includes(tk)?tk:ds[0];
 return ds;
}
function dayProg(t,d){
 if(t==="workout"){const seq=daySeq(d);return seq.length?seq.filter(x=>entryOn(x.inst.id,d)).length/seq.length:0}
 if(t==="sleep"){const s=sleepData(d);return calcSleepDur(s.sleep,s.wake)?1:0}
 if(t==="gut"){const c=gutCount(d);return c.due?c.done/c.due:0}
 return 0;
}

 return `<div class="wk" id="strip" role="group" aria-label="Pick a day">${ds.map((d,i)=>{
  const p=t==="fert"?fertProg(d,cx):dayProg(t,d);

  if(t==="fert"){const f=fertMark(d,cx);mk=f[0];mt=f[1]}
  else if(t==="gut"){const n=stoolLogs(d).length;if(n){mk="done";mt=n+(n===1?" bowel movement":" bowel movements")}}
  return `<button type="button" class="wd${d===tk?" td":""}${d>tk?" fu":""}" data-d="${d}" aria-pressed="${d===sel}"
   aria-label="${esc(shortDate(d))}, ${t==="workout"?esc(tagOf(d))+", ":""}${mt?mt+", ":""}${Math.round(p*100)}% done" onclick="pick('${d}')">
   <span>${DSHORT[DAYS[i]]}</span><b class="num">${dnum(d)}</b>${t==="workout"?`<small class="wt" aria-hidden="true">${esc(tagOf(d))}</small>`:""}<i class="bar"><i style="width:${Math.round(p*100)}%"></i></i><i class="mk ${mk}"></i></button>`;
 }).join("")}</div>`;
}
/* the Workout tab can look one week ahead, so a new plan can be seen before it starts */
const maxAhead=()=>tab==="workout"?1:0;
function renderTop(){
 const month=tab==="fert"&&fertView==="month",off=month?monthOff:weekOff,unit=month?"month":"week",go=month?"goMonth":"goWeek";
 const ahead=month?0:maxAhead();
 let sub;

 else{const a=monday(weekOff),b=new Date(a);b.setDate(b.getDate()+6);const f=d=>d.toLocaleDateString(undefined,{day:"numeric",month:"short"});sub=f(a)+" – "+f(b)}

/* =================== TOAST & UNDO =================== */
let toastT=null,toastUndo=null;
function toast(text,undo){
 const t=$("#toast");if(!t)return;
 toastUndo=undo||null;
 t.innerHTML=`<span>${esc(text)}</span>${undo?`<button type="button" onclick="undoToast()">Undo</button>`:""}`;
 t.classList.add("show");
 clearTimeout(toastT);toastT=setTimeout(hideToast,undo?6000:2600);
}
function hideToast(){const t=$("#toast");if(t)t.classList.remove("show");toastUndo=null}
function undoToast(){const u=toastUndo;hideToast();if(u){u();toast("Undone")}}
/* remembers the stored value of a few keys, and returns a function that puts them back */
function keep(...keys){
 const prev=keys.map(k=>{let v=null;try{v=localStorage.getItem(K+k)}catch(e){}return [k,v]});
 return ()=>{prev.forEach(([k,v])=>{try{v===null?localStorage.removeItem(K+k):localStorage.setItem(K+k,v)}catch(e){}});renderAll()};
}

/* the block's phase for the week on screen; the week before it starts gets a heads-up */
function blockGoal(){
 const mon=dateOf("mon");
 if(inBlock(mon)){
  const nxt=!inSplit(mon)&&dayDiff(mon,SPLIT_FROM)===7;
  return `<p class="goal">${esc(phaseLine(blockWeek(mon)))}</p>`
   +(nxt?`<div class="fst due"><h3>New routine from Monday, ${esc(longDate(SPLIT_FROM))}</h3>

     <button type="button" class="btn pri" onclick="goWeek(1)">Show next week</button></div>`:"");
 }

 return n>0&&n<=7?`<p class="goal">Your 16-week fertility block starts Monday, ${esc(longDate(WORK_FROM))}: pelvic floor sets every day and a reworked gym week. This week stays on the current plan.</p>`:"";

const MX_COLS=[["z2","Zone 2","min"],["vo2","VO2 max"],["me","Mobility & endurance"],["st","Strength"]];
/* the cardio columns are narrow, so their done boxes say "✓ 43" (minutes) or "✓ 4 × 3" (intervals × minutes) */
function mxDone(e,col){
 const n=norm(e);
 if(n&&!n.legacy&&n.mode==="time"&&n.sets.length){
  if(col==="z2")return String(Math.round(n.sets.reduce((a,s)=>a+(s.t||0),0)/60));
  const t=n.sets[0].t||0;
  if(col==="vo2"&&t%60===0&&n.sets.every(s=>s.t===t))return n.sets.length+" × "+t/60;
 }
 return shortSum(e);
}
/* the mobility column also carries the cool-down (core, circuit, stretch), which the split lists after Zone 2 */
function mxCell(dk,col,date){
 const p=dayPlan(date),cols=col==="me"?["me","cd"]:[col];
 const list=[];cols.forEach(c=>(p[c]||[]).forEach((x,i)=>list.push([c,i,x])));
 if(!list.length)return `<div class="em" role="cell"><span aria-hidden="true">–</span><span class="vh">Nothing planned</span></div>`;
 return `<div class="cell" role="cell">${list.map(([col,i,x])=>{
  const ex=EX[x.id],e=entryOn(x.id,date);
  /* keep units with their numbers and ranges whole, so a narrow box never splits "30–40 m" */
  const tight=s=>s.replace(/(\d)–(\d)/g,"$1–⁠$2").replace(/ (s|m|min|reps|sets)\b/g," $1");
  const main=tight(x.b||ex.n),sub=tight(e?"✓ "+mxDone(e,col):(x.i!==undefined?x.i:x.t));
  const label=(x.f||ex.f)+", "+(e?"logged "+shortSum(e):"target "+x.t);
  return `<button type="button" class="ch${e?" done":""}" data-k="${dk}|${col}|${i}" aria-label="${esc(label)}" onclick="openEx('${date}','${col}',${i})">`
   +`<span class="n">${esc(main)}</span>${sub?`<span class="s num">${esc(sub)}</span>`:""}</button>`;
 }).join("")}</div>`;
}

 const rows=DAYS.map(dk=>{
  const date=dateOf(dk),fu=date>tk,p=dayPlan(date),tag=tagOf(date);

  /* a rest day with a daily dose keeps its columns, so the dead hang and mobility can be logged from here */

  return `<div class="r${date===tk?" today":""}${fu?" fu":""}" role="row"${date===tk?' aria-current="date"':""}>${day}${cells}</div>`;
 }).join("");
 const blk=inBlock(dateOf("mon"));
 return `<section class="pg">
  ${workToggle()}
  ${blockGoal()}

/* =================== SLEEP TAB =================== */
/* One entry per night, saved under the morning you wake up (the day your Charge 6 gives the score):
   bedtime is the evening before (PM, or just after midnight); wake-up is that morning (AM). */
function sleepData(date){
 const v=S.get("sleep:"+date,null);
 if(!v||typeof v!=="object")return {sleep:"",wake:"",score:"",note:""};
 return {sleep:typeof v.sleep==="string"?v.sleep:"",wake:typeof v.wake==="string"?v.wake:"",
         score:v.score!=null?String(v.score):"",note:typeof v.note==="string"?v.note:""};
}
function toMin(t){
 const m=/^(\d{1,2}):(\d{2})/.exec(t||"");
 if(!m)return null;
 const h=+m[1],mi=+m[2];
 return h<24&&mi<60?h*60+mi:null;
}
const hhmm=m=>pad(Math.floor(m/60))+":"+pad(m%60);
/* bedtime from noon on is the evening before; earlier bedtimes are just after midnight */
function calcSleepDur(bed,wake){
 const b=toMin(bed),w=toMin(wake);
 if(b==null||w==null)return null;
 const diff=w-(b>=720?b-1440:b);
 if(diff<=0||diff>16*60)return null;
 return {diff,hours:Math.floor(diff/60),mins:diff%60,dec:Math.round(diff/6)/10};
}
function sleepProblem(s){
 if(!s.sleep||!s.wake||calcSleepDur(s.sleep,s.wake))return "";
 return "These times don't add up to a night. Bedtime is the evening before (PM, or just after midnight) and wake-up is the morning (AM).";
}
/* the time picker can't tell a PM bedtime from an AM one, so fix the usual slip */
function fixSleepTime(field,v){
 const m=toMin(v);if(m==null)return v;
 const h=Math.floor(m/60);let n=m;
 if(field==="sleep"){if(h>=4&&h<12)n=m+720;else if(h>=12&&h<16)n=m-720}
 else if(field==="wake"&&h>=13)n=m-720;
 return hhmm(n);
}
function putSleep(date,field,val){
 const tk=todayKey(),tonight=field==="sleep"&&date===addDays(tk,1);
 if(date>tk&&!tonight)return false;
 const d=sleepData(date);d[field]=val;
 if(!d.sleep&&!d.wake&&!d.score&&!d.note)S.del("sleep:"+date);else S.set("sleep:"+date,d);
 return true;
}
function scoreBadge(v){
 if(v===""||v==null||isNaN(Number(v)))return "";
 const n=Number(v);

const dietPlan=date=>date>=DIET_FROM?DIET_NEW.filter(st=>!st.from||date>=st.from):DIET_OLD;
function dietDone(date){const o=S.get("gut:diet:"+date,{});return o&&typeof o==="object"&&!Array.isArray(o)?o:{}}

/* iron every other day: "done" | "due" | "off". Future days assume each iron day gets taken. */
function ironDay(date){
 if(date<DIET_FROM)return null;
 if(isDietDone(date,IRON))return "done";
 const tk=todayKey();
 if(date<=tk)return isDietDone(addDays(date,-1),IRON)?"off":"due";
 let d=tk<DIET_FROM?DIET_FROM:tk,s=tk<DIET_FROM?"due":ironDay(tk);   /* the first day of the plan is an iron day */
 while(d<date){d=addDays(d,1);s=s==="off"?"due":"off"}
 return s;
}
function stepState(date,st){
 if(st.id===IRON&&ironDay(date)==="off")return "off";

 return "todo";
}
function gutCount(date){
 let done=0,due=0,skip=0;
 dietPlan(date).forEach(st=>{const s=stepState(date,st);if(s==="done"){done++;due++}else if(s==="todo")due++;else if(s==="skip")skip++});
 return {done,due,skip};
}

function fertData(date){
 const raw=S.get("fert:"+date,{}),v=raw&&typeof raw==="object"?raw:{};
 return {sex:!!v.sex,ddp:!!v.sex&&!!v.ddp,
         mb:v.nm===false,            /* saved as nm:false, so entries from the old "No masturbation" box carry over */
         cold:!!v.cold,rom:!!v.rom,note:typeof v.note==="string"?v.note:""};

function saveFert(date,patch){
 if(date>todayKey())return;
 const d=Object.assign(fertData(date),patch);
 if(!d.sex)d.ddp=false;
 if(!d.sex&&!d.mb&&!d.cold&&!d.rom&&!d.note)S.del("fert:"+date);
 else S.set("fert:"+date,{sex:d.sex,ddp:d.ddp,nm:!d.mb,cold:d.cold,rom:d.rom,note:d.note});
 if(!("note" in patch))renderAll();
}

/* every day with a release (intercourse or masturbation), oldest first */
function fertReleases(){
 const out=[];
 S.keys().forEach(k=>{if(k.indexOf("fert:")===0){const d=k.slice(5);if(isDate(d)){const fd=fertData(d);if(fd.sex||fd.mb)out.push(d)}}});

const lastBefore=(rel,date)=>{let p=null;for(const d of rel){if(d<date)p=d;else break}return p};

function fertCtx(){
 const tk=todayKey(),rel=fertReleases(),last=lastBefore(rel,addDays(tk,1));
 let next=last?addDays(last,3):tk;
 if(next<tk)next=tk;
 return {tk,rel,next};
}
/* days since the last release before this day (null if none); 3 or more means 2 full days of abstinence */
function fertGap(date,cx){const p=lastBefore(cx.rel,date);return p?dayDiff(p,date):null}

function nextPlanned(date,cx){
 if(date<=cx.next)return cx.next;

 return r?addDays(date,3-r):date;
}
function fertIsDay(date,cx){
 if(fertData(date).sex)return true;
 return date>cx.tk?plannedDay(date,cx):fertReady(fertGap(date,cx));
}

 const fd=fertData(d);
 if(fd.mb)return ["bl",fd.sex?"intercourse and masturbation logged":"masturbation logged"];
 if(fd.sex)return ["done","intercourse logged"];
 if(d>=cx.tk&&plannedDay(d,cx))return ["due","intercourse day"];

function fertProg(d,cx){
 cx=cx||fertCtx();
 if(d>cx.tk)return 0;
 const fd=fertData(d);
 const goals=[fd.cold,fd.rom,!fd.mb].concat(fertIsDay(d,cx)?[fd.sex,fd.ddp]:[]);

 const fd=fertData(date),g=fertGap(date,cx),ready=fertReady(g),tk=cx.tk;

  return plannedDay(date,cx)
   ?{cls:"",title:"Planned intercourse day",sub:"After 2 full days of abstinence. Practise deep deposit."}
   :{cls:"",title:"Abstinence day",sub:"Next intercourse day: "+shortDate(nextPlanned(date,cx))+"."};

  return {cls:"ok",title:"Intercourse logged"+(fd.ddp?" · deep deposit":""),sub:before+nextFrom(date)};

  return date===tk
   ?{cls:"due",title:"Intercourse day: due today",sub:done+"Practise deep deposit."}
   :{cls:"",title:"Intercourse day, nothing logged",sub:done.trim()};
 }
 return {cls:"",title:`Abstinence day ${g} of 2`,
         sub:g===1?"Next intercourse day: "+shortDate(addDays(date,2))+".":"Intercourse day is tomorrow."};
}
function setFertView(v){fertView=v==="month"?"month":"week";S.set("fview",fertView);refocus='.seg button[aria-pressed="true"]';renderAll()}
function fertRange(){
 if(fertView==="week")return DAYS.map(dateOf);
 const m=monthStart(monthOff),n=new Date(m.getFullYear(),m.getMonth()+1,0).getDate(),s0=ymd(m);
 return Array.from({length:n},(_,i)=>addDays(s0,i));
}
function fertCal(cx){
 const tk=todayKey(),ds=fertRange(),lead=(parseD(ds[0]).getDay()+6)%7;
 const cells=Array.from({length:lead},()=>`<span></span>`).join("")+ds.map(d=>{
  const [mk,mt]=fertMark(d,cx);
  return `<button type="button" class="cd${d===tk?" td":""}${d>tk?" fu":""}" data-d="${d}" aria-pressed="${d===sel}"
   aria-label="${esc(shortDate(d))}${mt?", "+mt:""}" onclick="pick('${d}')"><span class="num">${dnum(d)}</span><i class="mk ${mk}"></i></button>`;
 }).join("");
 return `<div class="cal" role="group" aria-label="Pick a day">${DAYS.map(k=>`<span class="dow">${DSHORT[k]}</span>`).join("")}${cells}</div>`;
}
function fertRow(f,label,sub,fd,o){
 const on=!!fd[f];
 return `<button type="button" class="row${on?" on":""}${o.neg?" neg":""}" data-f="${f}" aria-pressed="${on}"${o.off?" disabled":""} onclick="flipFert('${sel}','${f}')">
  <span class="bx" aria-hidden="true">${o.neg?"!":"✓"}</span><span class="rt"><span class="nm">${esc(label)}</span><span class="sb">${esc(sub)}</span></span></button>`;
}
function renderFert(){
 const tk=todayKey();ensureSel();
 const cx=fertCtx(),fu=sel>tk,fd=fertData(sel),st=fertStatus(sel,cx),isDay=fertIsDay(sel,cx);
 const past=fertRange().filter(d=>d<=tk),all=past.map(d=>[d,fertData(d)]);
 const sexDays=all.filter(([,x])=>x.sex);
 const onCadence=sexDays.filter(([d])=>fertReady(fertGap(d,cx))).length;
 const ddpCount=sexDays.filter(([,x])=>x.ddp).length;
 const count=k=>all.filter(([,x])=>x[k]).length;
 const period=fertView==="month"?(monthOff===0?"This month":"That month"):(weekOff===0?"This week":"That week");
 const ofSex=(label,n)=>sexDays.length?stat(label,n,sexDays.length,"of"):blankStat(label);
 const sexSub=fd.sex?"Logged":isDay?(fu?"Planned: 2 days of abstinence by then":"Due: 2 days of abstinence done"):"Not due today; log it if it happens";
 const ddpSub=fd.ddp?"Practised":fd.sex?"Tick if practised":"Log intercourse first";
 return `<section class="pg">
  <p class="goal">Intercourse every 3rd day, after 2 full days of abstinence. Cold therapy and romance every day.</p>
  ${fertToggle()}
  <div class="fst ${st.cls}"><h3>${esc(st.title)}</h3><p>${esc(st.sub)}</p></div>
  ${fertView==="month"?fertCal(cx):dayStrip("fert")}
  <p class="lg"><span><i class="mk done"></i>Intercourse</span><span><i class="mk due"></i>Intercourse day</span><span><i class="mk bl"></i>Masturbation</span></p>
  <div class="dh"><h2>${sel===tk?"Today":DNAME[dkOf(sel)]}</h2><span>${longDate(sel)}</span></div>
  <div class="list">
   <div class="gh">Every day</div>
   ${fertRow("cold","Cold therapy","Cool water or a cool pack, never ice on bare skin",fd,{off:fu})}
   ${fertRow("rom","Romance with your wife","Love, affection and time together",fd,{off:fu})}
   <div class="gh">Intercourse</div>
   ${fertRow("sex","Intercourse",sexSub,fd,{off:fu})}
   ${fertRow("ddp","Deep deposit",ddpSub,fd,{off:fu||!fd.sex})}
   <div class="gh">Abstinence</div>
   ${fertRow("mb","Masturbation",fd.mb?"Logged as a miss; the clock restarted":"Counts as a miss and restarts the 2-day clock",fd,{off:fu,neg:true})}
  </div>
  <div class="field"><label for="fert_notes">Notes</label>
   <textarea id="fert_notes" class="ta" placeholder="Time together, energy, how you both felt…"${fu?" disabled":""} oninput="saveFert('${sel}',{note:this.value})">${esc(fd.note)}</textarea></div>
  <div class="dh"><h3>${period}</h3><span>Days so far: ${past.length}</span></div>
  <div class="stats">
   ${stat("Intercourse",sexDays.length,null)}
   ${ofSex("After 2-day abstinence",onCadence)}
   ${ofSex("Deep deposit",ddpCount)}
   ${stat("Cold therapy days",count("cold"),past.length)}
   ${stat("Romance days",count("rom"),past.length)}
   ${badStat("Masturbation",count("mb"))}

 </section>`;

function fertToggle(){
 return `<div class="seg" role="group" aria-label="Fertility view">
  <button type="button" aria-pressed="${fertView==="week"}" onclick="setFertView('week')">Week</button>
  <button type="button" aria-pressed="${fertView==="month"}" onclick="setFertView('month')">Month</button></div>`;
}

/* =================== BACKUP =================== */
function backupFoot(){
 const d=S.get("lastexport",null);
 let text,stale;
 if(!isDate(d)){text="No backup yet. Your log is stored only in this browser.";stale=true}
 else{const n=dayDiff(d,todayKey());text="Last backup: "+shortDate(d)+(n>=7?` (${n} days ago)`:"");stale=n>=7}
 return `<div class="foot${stale?" stale":""}"><span>${esc(text)}</span>
  <button type="button" onclick="exportData()">Back up</button>
  <button type="button" onclick="document.getElementById('imp').click()">Restore</button></div>`;
}
function allData(){const d={};S.keys().forEach(k=>{try{d[k]=JSON.parse(localStorage.getItem(K+k))}catch(e){}});return d}
function markBackup(tk){S.set("lastexport",tk);if(!sheet)renderAll()}
function downloadFile(text,name){
 const b=new Blob([text],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
/* on iPhone this opens the share sheet, so "Save to Files", AirDrop or Messages all work */
async function exportData(){
 const tk=todayKey(),d=allData();d.lastexport=tk;
 const name="health-log-"+tk+".json",json=JSON.stringify(d,null,1);
 let file=null;try{file=new File([json],name,{type:"application/json"})}catch(e){}
 let canFile=false;try{canFile=!!(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]}))}catch(e){}
 if(canFile){
  try{await navigator.share({files:[file],title:"Four Pillars backup"});markBackup(tk);toast("Backup saved")}
  catch(e){if(!e||e.name!=="AbortError"){downloadFile(json,name);markBackup(tk)}}
  return;
 }
 downloadFile(json,name);markBackup(tk);
}
const KNOWN=/^(lift:|mode:|sleep:|gut:|fert:|wchk:|fview$|wview$|lastexport$)/;
function importData(inp){
 const f=inp.files&&inp.files[0];inp.value="";if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  let d;try{d=JSON.parse(r.result)}catch(e){toast("That file isn't a backup from this app.");return}
  if(!d||typeof d!=="object"||Array.isArray(d)){toast("That file isn't a backup from this app.");return}
  const keys=Object.keys(d).filter(k=>k&&k.length<80);
  if(!keys.some(k=>KNOWN.test(k))){toast("That file has no log entries.");return}
  const when=isDate(d.lastexport)?" from "+shortDate(d.lastexport):"";
  confirmAsk({title:"Restore this backup?",ok:"Replace",danger:true,run:()=>doImport(d,keys),
   text:`This replaces everything in the app with the backup${when} (${keys.length} entries). You can undo right after.`});
 };
 r.onerror=()=>toast("Couldn't read that file.");
 r.readAsText(f);
}
function snapshotAll(){
 const snap={};S.keys().forEach(k=>{try{snap[k]=localStorage.getItem(K+k)}catch(e){}});
 return ()=>{S.keys().forEach(k=>{if(!(k in snap))S.del(k)});
  Object.keys(snap).forEach(k=>{try{localStorage.setItem(K+k,snap[k])}catch(e){}});
  resetView();renderAll()};
}
function resetView(){
 Object.keys(drafts).forEach(k=>delete drafts[k]);openWhy.clear();
 tab="gut";sel=null;weekOff=0;monthOff=0;fertView=S.get("fview","week")==="month"?"month":"week";
 workView=S.get("wview","day")==="week"?"week":"day";
}
function doImport(d,keys){
 const undo=snapshotAll();
 S.keys().forEach(k=>S.del(k));
 for(const k of keys){if(!S.set(k,d[k])){undo();toast("Couldn't restore: this browser is out of space. Nothing changed.");return}}
 resetView();renderAll();toast("Backup restored",undo);
}

/* =================== START =================== */
/* home-screen apps stay suspended overnight; jump to the new day instead of leaving yesterday open */
function checkDay(){
 const tk=todayKey();
 if(tk===lastTk)return;
 if(!sel||sel===lastTk){sel=null;weekOff=0;monthOff=0}
 lastTk=tk;
 if(!sheet)renderAll();
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkDay()});
window.addEventListener("pageshow",checkDay);
window.addEventListener("focus",checkDay);
setInterval(()=>{if(!document.hidden)checkDay()},60000);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheet)closeSheet()});
if(window.visualViewport){visualViewport.addEventListener("resize",fitSheet);visualViewport.addEventListener("scroll",fitSheet)}
/* ask Safari to keep this app's storage (iPhone and iPad only; elsewhere it can trigger a prompt) */
try{if(navigator.standalone!==undefined&&navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
renderAll();
</script>
