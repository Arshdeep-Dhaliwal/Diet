<style>
/* Minimal look: one ink, one accent, hairlines instead of boxes. */
:root{
  color-scheme:light dark;
  --bg:#fbfaf8;--card:#fff;--line:#eceae4;--bd:#d9d6ce;--text:#1a1917;--t2:#67645c;--t3:#b3afa6;
  --acc:#2f6f5e;--acc-bg:#e8f1ee;--alert:#a14545;--alert-bg:#f9ecec;
  --ink:#1a1917;--on-ink:#fff;--on:#fff;
  --shade:rgba(26,25,23,.4);--toast:#1a1917;--toast-t:#f4f2ee;--toast-a:#8fd3bd;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121211;--card:#1b1b19;--line:#262522;--bd:#3d3b37;--text:#efede8;--t2:#a29f97;--t3:#5f5c56;
    --acc:#6cbfa6;--acc-bg:#1b2925;--alert:#e39494;--alert-bg:#301e1e;
    --ink:#efede8;--on-ink:#121211;--on:#121211;--shade:rgba(0,0,0,.6);--toast:#efede8;--toast-t:#1a1917;--toast-a:#2f6f5e}
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;background:var(--bg)}
html.lock,html.lock body{overflow:hidden}
html.nightmode,html.nightmode body{background:#121211}
body{background:var(--bg);color:var(--text);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
html.nightmode body{color:#efede8}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button:disabled{cursor:default;opacity:.5}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 22px) max(20px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 100px) max(20px,env(safe-area-inset-left))}
html.nightmode .app{max-width:none;padding:0}
.pg{display:flex;flex-direction:column;gap:26px}
h1{font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.025em}
h2{font-size:16px;line-height:1.3;font-weight:600}
.intro{font-size:15px;line-height:1.45;color:var(--t2);margin-top:6px}
.hdr{display:flex;flex-direction:column;gap:4px}
.dl{font-size:13.5px;color:var(--t2)}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.ch>span{font-size:13.5px;color:var(--t2);text-align:right}
.ch>span.bad{color:var(--alert);font-weight:600}
.kick{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--t2)}
.lnk{flex-shrink:0;min-height:44px;padding:0 6px;font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--bd)}
.note{font-size:13.5px;line-height:1.45;color:var(--t2);margin-top:8px}
.note.bad{color:var(--alert);font-weight:600}
.foot{font-size:13px;line-height:1.45;color:var(--t2);text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* buttons */
.btn{min-height:48px;padding:0 18px;border:1px solid var(--bd);border-radius:12px;font-size:15.5px;font-weight:600}
.btn.pri,.btn.ink{flex:1;border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.btn.del{color:var(--alert)}
.btn.wide,.rowbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.rowbtn{min-height:48px;border:1px solid var(--bd);border-radius:12px;font-size:15px;font-weight:600}
.links{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 18px}

/* notices: only shown when something needs you */
.al{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.al>span{flex:1;display:flex;flex-direction:column;min-width:0}
.al b{font-size:15px;font-weight:600}
.al small{font-size:13px;color:var(--t2)}
.al.bad{border-color:var(--alert)}
.al.bad b{color:var(--alert)}
.stack{display:flex;flex-direction:column;gap:8px}

/* six pillars: one thin line each */
.pl{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.pk{display:flex;flex-direction:column;gap:7px;min-height:56px;padding:4px 0;text-align:left;min-width:0}
.pn{font-size:12px;font-weight:600;white-space:nowrap}
.pc{font-size:12px;color:var(--t2)}
.bar{display:block;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--text);transition:width .3s ease}
.pk.full .bar i{background:var(--acc)}
.pk.full .pc{color:var(--acc);font-weight:600}
.bar.lg{height:5px;border-radius:3px}
.bar.lg i{background:var(--acc)}

/* the one card: what to do now */
.now{display:flex;flex-direction:column;gap:10px;padding:18px 18px 16px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.nk{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--t2)}
.now h2{font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.015em}
.now p,.now ul{font-size:14.5px;line-height:1.45;color:var(--t2)}
.now ul{padding-left:18px}
.nb{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.tmr{font-size:34px;line-height:1;font-weight:700;letter-spacing:-.02em;color:var(--text)}

/* fold-away sections */
.dzs{border-bottom:1px solid var(--line)}
.dz{border-top:1px solid var(--line)}
.dh{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;text-align:left}
.dh b{flex:1;font-size:16px;font-weight:600}
.dh span{font-size:13.5px;color:var(--t2)}
.dh span.bad{color:var(--alert);font-weight:600}
.dh svg{width:16px;height:16px;color:var(--t3);transition:transform .15s}
.dh[aria-expanded="true"] svg{transform:rotate(90deg)}
.db{padding:0 0 14px}

/* rows */
.ck{flex-shrink:0;display:grid;place-items:center;width:22px;height:22px;border-radius:999px;border:1.5px solid var(--bd);color:var(--on)}
.ck svg{width:13px;height:13px;stroke-width:3}
.lnr{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;text-align:left}
.lnr.ok .ck,.tl.on .ck{background:var(--acc);border-color:var(--acc)}
.lt{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.lt b{font-size:15px;font-weight:500}
.lt small{font-size:13px;color:var(--t2)}
.yn{display:flex;gap:6px;flex-shrink:0}
.yn button,.sbtn{min-width:52px;min-height:44px;padding:0 12px;border:1px solid var(--bd);border-radius:10px;font-size:14.5px;font-weight:600}
.yn button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.sbtn{flex-shrink:0}
.tl{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;text-align:left}
.tt{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.tt b{font-size:15px;font-weight:500}
.tt small{font-size:12.5px;line-height:1.35;color:var(--t2)}
.tm{flex-shrink:0;font-size:12.5px;color:var(--t2);white-space:nowrap}
.tl.on .tt b{color:var(--t2)}
.tl.auto .ck{border-style:dashed}
.tl.auto.on .ck{border-style:solid}
.tl.off{opacity:.55}
.tl.off .ck{visibility:hidden}
.bmrow{display:flex;flex-wrap:wrap;gap:8px}
.bmc{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--bd);font-size:14px}
.bmc b{font-weight:600}
.bmc.flag{border-color:var(--alert);color:var(--alert)}
.bmc.add{border-style:dashed;font-weight:600}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;background:var(--bg);border-top:1px solid var(--line);padding:6px max(4px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 2px) max(4px,env(safe-area-inset-left))}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;font-size:11px;font-weight:500;color:var(--t2)}
.tabs button[aria-current="page"]{color:var(--text);font-weight:700}
.tabs svg{width:22px;height:22px;stroke-width:1.6}
.tabs button[aria-current="page"] svg{stroke-width:2}
.tabs .plus{justify-self:center;width:46px;height:46px;min-height:0;border-radius:999px;background:var(--ink);color:var(--on-ink)}
.tabs .plus svg{stroke-width:2}

/* bottom sheet */
.shade{position:fixed;inset:0;background:var(--shade);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--bg);color:var(--text);border-radius:20px 20px 0 0;
       max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
       padding:8px 20px calc(env(safe-area-inset-bottom) + 20px);box-shadow:0 -8px 30px rgba(0,0,0,.12);animation:up .22s ease-out}
.sheet:focus{outline:none}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.sw,.sw i,.bar i,.dh svg{transition:none}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--bd);margin:0 auto 14px}
.sh{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.sh h2{font-size:21px;font-weight:700;letter-spacing:-.015em;line-height:1.25}
.sh p{font-size:13.5px;color:var(--t2);margin-top:2px}
.x{margin-left:auto;width:44px;height:44px;flex-shrink:0;border-radius:50%;color:var(--t2);font-size:24px;line-height:1}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.sec{font-size:15px;font-weight:600;margin:18px 0 8px}
.lb{display:block;font-size:13px;font-weight:600;color:var(--t2);margin:14px 0 6px}
.inp{display:block;width:100%;min-height:46px;padding:0 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);font-size:16px}
textarea.inp{min-height:84px;padding:10px 12px;resize:vertical;line-height:1.4}
.inp:focus{outline:2px solid var(--acc);outline-offset:1px}
.tin{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--t2)}
.pill svg{width:15px;height:15px}
.box{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.box.tint{border:0;border-radius:12px;background:var(--card);padding:12px 14px}
.box>*+*{border-top:1px solid var(--line)}
.box.tint>*+*{border-top:0}
.qk{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;text-align:left;border-top:1px solid var(--line)}
.qk:first-of-type{border-top:0}
.qk .qi{display:grid;place-items:center;width:28px;height:28px;color:var(--text)}
.qk .qi svg{width:22px;height:22px;stroke-width:1.6}
.rule{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:14.5px;line-height:1.4}
.rule::before{content:"";flex:none;width:4px;height:4px;border-radius:999px;background:var(--t3);margin-top:9px}
.tip{margin-top:8px;font-size:13.5px;line-height:1.45;color:var(--t2)}

/* switches */
.swr{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:6px 0;text-align:left}
.sw{flex-shrink:0;position:relative;width:48px;height:28px;border-radius:999px;background:var(--bd);transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.swr[aria-checked="true"] .sw{background:var(--acc)}
.swr[aria-checked="true"] .sw i{transform:translateX(20px)}

/* chips and choices */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border:1px solid var(--bd);border-radius:999px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{min-width:52px;min-height:44px;padding:0 12px;border:1px solid var(--bd);border-radius:10px;font-weight:600}
.opts button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.bris{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.bris button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;border:1px solid var(--bd);border-radius:12px}
.bris b{font-size:19px;font-weight:700}
.bris small{font-size:12px;color:var(--t2);line-height:1.2;text-align:center}
.bris button[aria-checked="true"]{border-color:var(--ink);background:var(--ink)}
.bris button[aria-checked="true"] b,.bris button[aria-checked="true"] small{color:var(--on-ink)}
.seg2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg2 button{min-height:48px;border:1px solid var(--bd);border-radius:12px;font-weight:600;font-size:15px}
.seg2 .ok[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.seg2 .bl{color:var(--alert)}
.seg2 .bl[aria-pressed="true"]{border-color:var(--alert);background:var(--alert);color:var(--on)}
.effect{display:flex;gap:10px;align-items:center;padding-top:14px;margin-top:16px;border-top:1px solid var(--line);color:var(--t2);font-size:14px;line-height:1.4}
.effect svg{width:20px;height:20px}
.effect b{color:var(--text)}
.ifg{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px 10px;align-items:center}
.ifg label{font-size:14px;font-weight:600;color:var(--t2)}
.addf{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.addr{display:flex;gap:8px}
.addr .inp{flex:1}
.fr{display:flex;align-items:center;gap:4px;min-height:48px}
.fr+.fr{border-top:1px solid var(--line)}
.fr .tb{flex:1;display:flex;align-items:center;gap:12px;min-height:48px;text-align:left;font-size:15px;min-width:0}
.fr.done .tb{color:var(--t2);text-decoration:line-through}
.fr.done .ck{background:var(--acc);border-color:var(--acc)}
.xb{width:44px;height:44px;flex-shrink:0;border-radius:10px;color:var(--t2);font-size:22px;line-height:1}
.grp{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--t2);padding:16px 0 4px}
.ms{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;align-items:center;min-height:58px;padding:6px 0}
.ms b{display:block;font-size:13.5px;font-weight:600}
.ms small{font-size:12px;color:var(--t2)}

/* fourteen-day dots */
.roll{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px;margin-top:14px}
.roll i{aspect-ratio:1;border-radius:999px;border:1.5px solid var(--bd)}
.roll i.y{background:var(--text);border-color:var(--text)}
.roll i.cb{border:3px solid var(--text)}
.roll i.na{border-style:dashed;opacity:.45}
.roll i.open{border-color:var(--text);border-style:dashed}

/* batches */
.phs{margin-top:14px}
.ph{display:flex;align-items:center;gap:12px;min-height:52px}
.ph .n{display:grid;place-items:center;width:24px;height:24px;border-radius:999px;border:1.5px solid var(--bd);font-size:13px;font-weight:600;flex-shrink:0}

/* move timer */
function stopTimer(silent){timer=null;if(!silent)renderAll()}
function tickTimer(){
 if(!timer)return;
 const left=timer.end-Date.now();
 document.querySelectorAll("[data-tmr]").forEach(el=>{el.textContent=fmtLeft(left)});
 if(left<=0&&!timer.done){timer.done=true;toast("Time's up. Tap Done.");try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}}
}
setInterval(tickTimer,1000);

/* =================== TOAST & UNDO =================== */
let toastT=null,toastUndo=null;
function toast(text,undo){
 const t=$("#toast");if(!t)return;
 toastUndo=undo||null;
 t.innerHTML=`<span>${esc(text)}</span>${undo?`<button type="button" onclick="undoToast()">Undo</button>`:""}`;
 t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(hideToast,undo?6000:2600);
}
function hideToast(){const t=$("#toast");if(t)t.classList.remove("show");toastUndo=null}
function undoToast(){const u=toastUndo;hideToast();if(u){u();toast("Undone")}}
/* remembers the stored value of a few keys, and returns a function that puts them back */
function keep(...keys){
 const prev=keys.map(k=>{let v=null;try{v=localStorage.getItem(K+k)}catch(e){}return [k,v]});
 return ()=>{prev.forEach(([k,v])=>{try{v===null?localStorage.removeItem(K+k):localStorage.setItem(K+k,v)}catch(e){}});resetCaches();renderAll();if(sheet)renderSheet()};
}
function resetCaches(){liftDates=null;firstStoolCache=null}

let sheet=null,sh=null,sheetReturn=null;
function openSheet(kind,state){
 sheet=kind;sh=state||{};sheetReturn=document.activeElement;
 $("#app").inert=true;document.documentElement.classList.add("lock");
 renderSheet("sheet");
}
function renderSheet(focusId){
 const root=$("#sheetRoot");
 if(!sheet){root.innerHTML="";return}
 let el=$("#sheet");
 if(!el){root.innerHTML=`<div class="shade" data-act="x"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT" tabindex="-1"></div>`;el=$("#sheet")}
 const top=el.scrollTop;
 el.innerHTML=`<div class="grab" aria-hidden="true"></div>`+(SHEETS[sheet]?SHEETS[sheet]():"");
 el.scrollTop=top;
 if(focusId){const t=focusId==="sheet"?el:document.getElementById(focusId)||el;try{t.focus({preventScroll:t===el})}catch(e){t.focus()}}
 fitSheet();
}
function closeSheetNow(){
 const back=sheetReturn;
 sheet=null;sh=null;sheetReturn=null;
 $("#sheetRoot").innerHTML="";
 $("#app").inert=false;document.documentElement.classList.remove("lock");
 renderAll();
 if(back&&back.dataset&&back.dataset.act){
  const sig=`[data-act="${back.dataset.act}"]`+["k","id","d","v"].map(f=>back.dataset[f]!=null?`[data-${f}="${back.dataset[f]}"]`:"").join("");
  try{const el=$("#app").querySelector(sig);if(el)el.focus({preventScroll:true})}catch(e){}
 }
}
function closeSheet(){closeSheetNow()}
/* keep the sheet above the iPhone keyboard */
function fitSheet(){
 const el=$("#sheet"),vv=window.visualViewport;if(!el||!vv)return;
 const kb=Math.max(0,Math.round(window.innerHeight-vv.height-vv.offsetTop));
 if(kb>80){el.style.bottom=kb+"px";el.style.maxHeight=Math.round(vv.height-8)+"px";el.style.paddingBottom="14px"}
 else{el.style.bottom="";el.style.maxHeight="";el.style.paddingBottom=""}
}

   <p style="font-size:15px;line-height:1.45;color:var(--t2)">The clean days before it still count. The comeback starts with the next thing you eat.</p>

    <div class="lnr${dd.closed?" ok":""}" style="min-height:52px"><span class="ck" style="${dd.closed?"background:var(--acc);border-color:var(--acc)":""}">${dd.closed?I.check:""}</span><span class="lt"><b>Close the day before 7</b></span></div></div>

    <label for="cbThen">Then</label><input id="cbThen" class="inp" type="text" maxlength="100" value="${esc(s.thenx)}" data-in="sh" data-k="thenx" placeholder="I order it mild, no chili"></div>
   <div class="acts"><button type="button" class="btn pri gut" data-act="cbSave">Save the plan</button></div>`},

 fun:()=>`${head("Fun moment",wdmd(todayKey()))}<label class="lb" for="fnText" style="margin-top:4px">What was it?</label>

  <div class="acts"><button type="button" class="btn ink" data-act="funSave">Save</button></div>`,

 fever:()=>`${head("Fever or feeling sick",wdmd(todayKey()))}

  <label class="lb" for="fvT">Temperature (°C, optional)</label><input id="fvT" class="inp num" inputmode="decimal" style="width:150px" value="${esc(sh.temp)}" data-in="sh" data-k="temp" placeholder="38.4">

  <p class="note bad" id="sh_st" role="status"></p>
  <div class="acts">${sh.had?`<button type="button" class="btn del" data-act="feverDel">Clear</button>`:""}<button type="button" class="btn ink" data-act="feverSave">Save</button></div>`,

 meds:()=>{const tk=todayKey(),a=Array.isArray(dayD(tk).meds)?dayD(tk).meds:[];
  return `${head("Before taking a pill")}
  <p style="font-size:15px;line-height:1.45;color:var(--t2)">Is it on your list, or truly needed today? If it's new, ask the pharmacist whether it affects fertility.</p>
  <div class="box tint" style="margin-top:12px"><p class="kick" style="color:var(--t2)">ON YOUR LIST</p><p class="note" style="margin-top:4px">Iron + vitamin C (every other day) · D3 · omega-3 · CoQ10 · Centrum · creatine · Metamucil · RestoraLAX when due</p></div>
  <label class="lb" for="medName">Log something you took</label><div class="addr"><input id="medName" class="inp" type="text" maxlength="60" value="${esc(sh.name)}" data-in="sh" data-k="name" placeholder="e.g. acetaminophen 500 mg"><button type="button" class="btn ink" style="flex:none" data-act="medAdd">Log</button></div>
  ${a.length?`<div class="box" style="margin-top:12px">${a.map((x,i)=>`<div class="fr"><span class="tb" style="cursor:default">${esc(fmtClock(x.t))} · ${esc(x.n)}</span><button type="button" class="xb" data-act="medDel" data-v="${i}" aria-label="Delete ${esc(x.n)}">×</button></div>`).join("")}</div>`:""}`},

 sleep:()=>{const s=sh,dur=calcSleepDur(s.sleep,s.wake);
  return `${head("Last night","Saved to "+wdmd(s.date))}
  <button type="button" class="rowbtn" data-act="slPlan" style="margin-top:4px">As planned: ${esc(fmtM(outMin()))} to ${esc(fmtM(wakeMin()))}</button>
  <div class="tin"><div><label class="lb" for="slB">Bedtime</label><input id="slB" class="inp num" type="time" value="${esc(s.sleep)}" data-in="sh" data-k="sleep"></div>
   <div><label class="lb" for="slW">Wake-up</label><input id="slW" class="inp num" type="time" value="${esc(s.wake)}" data-in="sh" data-k="wake"></div></div>
  <label class="lb" for="slS">Charge 6 sleep score (optional)</label><input id="slS" class="inp num" inputmode="numeric" style="width:150px" value="${esc(s.score)}" data-in="sh" data-k="score" placeholder="84">
  <label class="lb" for="slN">Note (optional)</label><input id="slN" class="inp" type="text" maxlength="120" value="${esc(s.note)}" data-in="sh" data-k="note" placeholder="Wake-ups, room temperature…">

  <p class="note bad" id="sh_st" role="status"></p><div class="acts"><button type="button" id="sl_save" class="btn pri sleep" data-act="slSave">Save</button></div>`},

 pillar:()=>{const P=pillars(sh.date),p=P[sh.k],isT=sh.date===todayKey();
  const rows=p.items.map(it=>{
   if(it.id&&!it.auto)return `<button type="button" class="tl ${sh.k}${it.done?" on":""}" data-act="tick" data-id="${it.id}" data-d="${sh.date}" aria-pressed="${it.done}"><span class="ck" aria-hidden="true">${it.done?I.check:""}</span><span class="tt"><b>${esc(it.label)}</b></span></button>`;
   if(it.rel){const on=relOn(sh.date);return `<button type="button" class="tl ${sh.k}${it.done?" on":""}" data-act="rel" data-d="${sh.date}" aria-pressed="${on}"><span class="ck" aria-hidden="true">${it.done?I.check:""}</span><span class="tt"><b>${esc(it.label)}</b><small>${on?"Tap to remove":"Tap to log "+(isT?"today's":"that day's")}</small></span></button>`}
   const hint=it.close?"From Close the day":it.fun||it.tog?"Close the day or the Fun tab":it.sleep||it.night?"From the Last night card":
    it.fever?(it.done?"Automatic unless you log a fever":"Fever logged"):it.blood?(it.done?"From your bowel movement logs":"Blood logged"):"Automatic today";
   return `<div class="tl ${sh.k}${it.done?" on":""}"><span class="ck" aria-hidden="true">${it.done?I.check:""}</span><span class="tt"><b>${esc(it.label)}</b><small>${hint}</small></span></div>`;
  }).join("");
  return `${head(PN[sh.k]+" · "+p.done+" of "+p.due,(isT?"Today":wdmd(sh.date))+" · "+PGOAL[sh.k])}<div class="box">${rows}</div>`},

 how:()=>{const st=steps(sh.date).find(x=>x.id===sh.id);if(!st)return head("Not on today's list");
  const run=timer&&timer.id===st.id,isT=sh.date===todayKey();
  return `${head(st.name,wdmd(sh.date))}<div class="box tint ${st.p}">${st.how.map(x=>`<p class="rule">${esc(x)}</p>`).join("")}</div>
  ${isT&&st.timer?`${run?`<p class="tmr num ${st.p}" data-tmr style="margin-top:14px;text-align:center">${fmtLeft(timer.end-Date.now())}</p>`:""}
   <div class="acts">${run?`<button type="button" id="hw_stop" class="btn" data-act="stoptimer">Stop</button>`:`<button type="button" id="hw_start" class="btn pri ${st.p}" data-act="timer" data-id="${st.id}" data-v="${st.timer}">Start ${st.timer}:00</button>`}
    <button type="button" class="btn ink" data-act="howDone">Done</button></div>`:""}`}
};

/* bowel movements, in the same format as before */
function openStool(date,id,blood){
 if(date>todayKey())return;
 const e=id!=null?stools(date).find(x=>String(x.id)===String(id)):null;
 openSheet("bm",e?{date,id:e.id,time:typeof e.time==="string"?e.time:"",type:String(BRISTOL[e.type]?e.type:4),blood:!!e.blood,mucus:!!e.mucus,note:typeof e.note==="string"?e.note:"",ph:!!e.ph,five:!!e.five,nostr:!!e.nostr}
  :{date,id:null,time:nowHM(),type:"4",blood:!!blood,mucus:false,note:"",ph:true,five:true,nostr:true});
}
function saveStool(){
 const s=sh;if(!s||s.date>todayKey())return;
 const list=stools(s.date);let id=s.id;
 if(id==null){id=Date.now();while(list.some(x=>String(x.id)===String(id)))id++}
 const entry={id,time:s.time||nowHM(),type:Number(s.type)||4,blood:!!s.blood,mucus:!!s.mucus,note:String(s.note||"").trim().slice(0,100),ph:s.ph?1:0,five:s.five?1:0,nostr:s.nostr?1:0};
 const i=list.findIndex(x=>String(x.id)===String(id));
 if(i>=0)list[i]=entry;else list.push(entry);
 list.sort((a,b)=>String(a.time||"").localeCompare(String(b.time||"")));
 const undo=keep("gut:stools:"+s.date);
 if(!S.set("gut:stools:"+s.date,list)){const st=$("#sh_st");if(st)st.textContent="Couldn't save in this browser. Try again.";return}
 resetCaches();closeSheetNow();
 toast(entry.blood?"Logged. Honest logs are how this gets fixed.":i>=0?"Updated":"Logged",undo);
}
function delStool(){
 const s=sh;if(!s||s.id==null)return;
 const undo=keep("gut:stools:"+s.date),list=stools(s.date).filter(x=>String(x.id)!==String(s.id));
 if(list.length)S.set("gut:stools:"+s.date,list);else S.del("gut:stools:"+s.date);
 resetCaches();closeSheetNow();toast("Entry deleted",undo);
}
function openClose(date){
 if(date>todayKey())return;
 const dd=dayD(date),slips=Array.isArray(dd.slips)?dd.slips:[],v={};
 /* switches start on unless answered no or a slip says otherwise; items new since the day was closed start on too */
 closeFor(date).forEach(c=>{const slipped=slips.some(x=>{const r=SLIPS.find(y=>y[0]===x.k);return r&&r[2]===c.k});
  v[c.k]=dd[c.k]===1?true:(dd[c.k]===0||slipped)?false:true});
 const st=Number(dd.stress);
 openSheet("close",{date,v,fun:String(dd.fun||""),tog:!!dd.tog,stress:st>=1&&st<=5?st:null});
}
function saveClose(){
 const s=sh,patch={fun:s.fun.trim().slice(0,140),tog:s.tog?1:null,stress:s.stress||null,closed:nowHM()};
 closeFor(s.date).forEach(c=>patch[c.k]=s.v[c.k]?1:0);
 const undo=keep("day:"+s.date),isT=s.date===todayKey();putDay(s.date,patch);
 closeSheetNow();
 const after=pillars(s.date),full=PK.filter(k=>after[k].due&&after[k].done>=after[k].due).length;
 toast(isT?(nowMin()<SCREENS_OFF?`Day closed: ${full} of 6 pillars full. Screens off at 7.`:`Day closed: ${full} of 6 pillars full.`):"Day closed",undo);
}
function openSleep(date){
 if(date>todayKey())return;
 const s=sleepData(date);openSheet("sleep",{date,sleep:s.sleep,wake:s.wake,score:s.score,note:s.note});
}
function saveSleep(){
 const s=sh,st=$("#sh_st");
 const bed=s.sleep?fixSleepTime("sleep",s.sleep):"",wake=s.wake?fixSleepTime("wake",s.wake):"";
 if(bed&&wake&&!calcSleepDur(bed,wake)){if(st)st.textContent="Those times don't add up to a night. Bedtime is the evening before; wake-up is the morning.";return}
 const sc=String(s.score||"").trim();
 if(sc&&!(Number(sc)>=0&&Number(sc)<=100)){if(st)st.textContent="Sleep score is 0 to 100.";return}
 const d={sleep:bed,wake,score:sc?Number(sc):"",note:String(s.note||"").trim().slice(0,120)};
 const undo=keep("sleep:"+s.date);
 if(!d.sleep&&!d.wake&&d.score===""&&!d.note)S.del("sleep:"+s.date);else S.set("sleep:"+s.date,d);
 closeSheetNow();
 const dur=calcSleepDur(d.sleep,d.wake);
 toast(dur?`${dur.hours} h ${pad(dur.mins)} m${dur.diff>=480?" · goal met":""}`:"Saved",undo);
}

/* =================== BACKUP =================== */
function allData(){const d={};S.keys().forEach(k=>{try{d[k]=JSON.parse(localStorage.getItem(K+k))}catch(e){}});return d}
function downloadFile(text,name){
 const b=new Blob([text],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function markBackup(tk){S.set("lastexport",tk);if(!sheet)renderAll()}
/* on iPhone this opens the share sheet, so "Save to Files", AirDrop or Messages all work */
async function exportData(){
 const tk=todayKey(),d=allData();d.lastexport=tk;
 const name="health-log-"+tk+".json",json=JSON.stringify(d,null,1);
 let file=null;try{file=new File([json],name,{type:"application/json"})}catch(e){}
 let canFile=false;try{canFile=!!(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]}))}catch(e){}
 if(canFile){
  try{await navigator.share({files:[file],title:"Six Pillars backup"});markBackup(tk);toast("Backup saved")}
  catch(e){if(!e||e.name!=="AbortError"){downloadFile(json,name);markBackup(tk)}}
  return;
 }
 downloadFile(json,name);markBackup(tk);toast("Backup downloaded");
}
const KNOWN=/^(lift:|mode:|sleep:|gut:|fert:|wchk:|jr:|day:|wrev:|fview$|wview$|lastexport$|wake$|iron$|funlist$|funbig$|tests$|setup$|ifthen$|planFrom$|v2From$|v2seen$)/;
function importData(inp){
 const f=inp.files&&inp.files[0];inp.value="";if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  let d;try{d=JSON.parse(r.result)}catch(e){toast("That file isn't a backup from this app.");return}
  if(!d||typeof d!=="object"||Array.isArray(d)){toast("That file isn't a backup from this app.");return}
  const keys=Object.keys(d).filter(k=>k&&k.length<80&&KNOWN.test(k));
  if(!keys.length){toast("That file has no log entries.");return}
  const when=isDate(d.lastexport)?" from "+wdmd(d.lastexport):"";
  confirmAsk({title:"Restore this backup?",ok:"Replace",danger:true,run:()=>doImport(d,keys),
   text:`This replaces everything in the app with the backup${when} (${keys.length} entries). You can undo right after.`});
 };
 r.onerror=()=>toast("Couldn't read that file.");
 r.readAsText(f);
}
function snapshotAll(){
 const snap={};S.keys().forEach(k=>{try{snap[k]=localStorage.getItem(K+k)}catch(e){}});
 return ()=>{S.keys().forEach(k=>{if(!(k in snap))S.del(k)});
  Object.keys(snap).forEach(k=>{try{localStorage.setItem(K+k,snap[k])}catch(e){}});resetCaches();renderAll()};
}
function doImport(d,keys){
 const undo=snapshotAll();
 S.keys().forEach(k=>S.del(k));
 for(const k of keys){if(!S.set(k,d[k])){undo();toast("Couldn't restore: this browser is out of space. Nothing changed.");return}}
 if(!isDate(S.get("planFrom",null)))S.set("planFrom",PLAN_FROM);
 if(!isDate(S.get("v2From",null)))S.set("v2From",V2_FROM);
 resetCaches();tab="today";sel=null;renderAll();toast("Backup restored",undo);
}

/* =================== START =================== */
/* home-screen apps stay suspended overnight: jump to the new day, and lock or unlock at 7 PM and at wake-up */
let lastNight=null;
function checkDay(){
 const tk=todayKey(),n=nightLocked();
 if(tk!==lastTk){lastTk=tk;sel=null;snoozed.clear();openS={};if(!sheet)renderAll();lastNight=n;return}
 if(n!==lastNight){lastNight=n;if(!sheet)renderAll();return}
 const ae=document.activeElement,typing=ae&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA");
 if(!sheet&&!typing&&tab==="today")renderAll();
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkDay()});
window.addEventListener("pageshow",checkDay);
window.addEventListener("focus",checkDay);
setInterval(()=>{if(!document.hidden)checkDay()},30000);
if(window.visualViewport){visualViewport.addEventListener("resize",fitSheet);visualViewport.addEventListener("scroll",fitSheet)}
/* ask Safari to keep this app's storage (iPhone and iPad only; elsewhere it can trigger a prompt) */
try{if(navigator.standalone!==undefined&&navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
lastNight=nightLocked();
renderAll();
</script>
